将目标和自己的<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>进行互换。

只交换能力值，<a href="https://wiki.52poke.com/zh-hans/%E6%90%BA%E5%B8%A6%E7%89%A9%E5%93%81">携带物品</a>、<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>状态、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%80%A7">特性</a>等均不受影响。

速度互换一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。
