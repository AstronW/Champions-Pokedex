对目标造成相当于<b>目标ＨＰ－使用者ＨＰ</b>的伤害。该招式无法对没有效果的属性的宝可梦造成伤害，但忽略其他属性相克和<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>。

目标ＨＰ不高于使用者ＨＰ时招式使用失败。

如果目标处于替身状态，蛮干以目标本体的ＨＰ计算伤害。

当目标是<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>宝可梦的伤害方式计算如下：
 •  <b>对极巨化宝可梦造成的伤害＝（当前极巨化宝可梦的ＨＰ÷ＨＰ提升倍数）－当前攻击方ＨＰ</b>
 •  •  ＨＰ提升倍数与<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96%E7%AD%89%E7%BA%A7">极巨化等级</a>对应，介于1.5与2之间；
 •  •  如果伤害≤0，则招式无效；
 •  •  最后计算出的伤害数值向上取整。
