交换下场时，回复自身最大<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>的<sup>1</sup>⁄<sub>3</sub>。

如果在特性受到影响时离场，先判定再生力特性的ＨＰ回复再恢复特性。因此，受<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E7%89%B9%E6%80%A7">无特性</a>或<a href="dex://entity/move:285">特性互换</a>等效果影响而失去再生力特性的宝可梦离场时不回复ＨＰ。通过<a href="dex://entity/move:285">特性互换</a>或<a href="dex://entity/ability:36">复制</a>获得再生力特性后离场时回复ＨＰ。

再生力特性不受<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>影响。
