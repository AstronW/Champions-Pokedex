将使用者的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>与目标的ＨＰ相加之后取其算术平均数，相加时不计算<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>的影响。

ＨＰ较高的一方ＨＰ降低超过平均数的部分，ＨＰ较低的一方ＨＰ增加不足平均数的部分。&lt;ref&gt;[https://www.bilibili.com/video/av78429689 bilibili：极巨化实验室01；]&lt;/ref&gt;

分担痛楚一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

如果目标为<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态，招式使用失败。

分担痛楚不造成伤害，因此不会触发任何与伤害有关的判定。
