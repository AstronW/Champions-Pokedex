将目标的全部<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>数值变为其<a href="https://wiki.52poke.com/zh-hans/wp%3A%E5%8A%A0%E6%B3%95%E9%80%86%E5%85%83">相反数</a>。

颠倒一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

颠倒是直接改变目标<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>的上升和下降而不是使其上升或下降，因此目标的<a href="dex://entity/ability:29">恒净之躯</a>特性或<a href="https://wiki.52poke.com/zh-hans/%E7%99%BD%E9%9B%BE">白雾</a>状态不能阻止该招式特效的发动，<a href="https://wiki.52poke.com/zh-hans/%E5%8D%95%E7%BA%AF">单纯</a>、<a href="dex://entity/ability:128">不服输</a>、<a href="dex://entity/ability:126">唱反调</a>、<a href="dex://entity/ability:172">好胜</a>、<a href="dex://entity/ability:240">镜甲</a>等特性的效果不会发动。

颠倒会因目标的<a href="dex://entity/ability:156">魔法镜</a>特性而作用在自己身上。
