异性宝可梦使用<a href="https://wiki.52poke.com/zh-hans/%E6%8E%A5%E8%A7%A6%E7%B1%BB%E6%8B%9B%E5%BC%8F">接触类招式</a>攻击该特性的宝可梦时会有30%的机率<a href="https://wiki.52poke.com/zh-hans/%E7%9D%80%E8%BF%B7">着迷</a>。

<a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>的每一击都会单独触发该特性。

在闯入对战中，能让入场宝可梦与队首宝可梦性别不同的概率变为50%。
