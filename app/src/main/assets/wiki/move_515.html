使用者消耗全部剩余<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>，自身陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，然后对目标造成使用者消耗<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>的伤害。该招式无法对没有效果的属性的宝可梦造成伤害，但忽略其他属性相克和<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>。

如果搏命没有命中、对目标<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E7%9B%B8%E5%85%8B%E8%A1%A8">没有效果</a>或被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>，则招式使用失败，使用者不会受到伤害。

<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E6%8A%AB%E5%B8%A6">气势披带</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E5%A4%B4%E5%B8%A6">气势头带</a>或<a href="dex://entity/ability:5">结实</a>特性不能阻止使用者陷入濒死状态。
