
本回合内自身进入<a href="https://wiki.52poke.com/zh-hans/%E4%B8%87%E4%BC%97%E7%9E%A9%E7%9B%AE">万众瞩目</a>状态。直到这回合结束，所有对方使用的<a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E4%BD%9C%E7%94%A8%E8%8C%83%E5%9B%B4%E4%B8%BA%E5%8D%95%E4%BD%93%E9%80%89%E6%8B%A9%E7%9A%84%E6%8B%9B%E5%BC%8F">作用范围为单体选择的招式</a>都会攻向自己。如果我方有多只宝可梦都进入万众瞩目状态，则速度最高的宝可梦生效。
愤怒粉造成的<a href="https://wiki.52poke.com/zh-hans/%E4%B8%87%E4%BC%97%E7%9E%A9%E7%9B%AE">万众瞩目</a>状态对草属性、<a href="dex://entity/ability:142">防尘</a>特性、携带<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%B0%98%E6%8A%A4%E7%9B%AE%E9%95%9C">防尘护目镜</a>的宝可梦无效。

该招式不会被<a href="dex://entity/move:274">借助</a>或<a href="dex://entity/move:118">挥指</a>发动。
