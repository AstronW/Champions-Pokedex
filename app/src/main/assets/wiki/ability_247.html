该特性的宝可梦使树果效果变为２倍，包括回复ＨＰ（如<a href="https://wiki.52poke.com/zh-hans/%E6%96%87%E6%9F%9A%E6%9E%9C">文柚果</a>）、恢复ＰＰ（如<a href="https://wiki.52poke.com/zh-hans/%E8%8B%B9%E9%87%8E%E6%9E%9C">苹野果</a>）、减半１种属性招式的伤害（如<a href="https://wiki.52poke.com/zh-hans/%E7%83%9B%E6%9C%A8%E6%9E%9C">烛木果</a>）、提升能力变化（如<a href="https://wiki.52poke.com/zh-hans/%E6%98%9F%E6%A1%83%E6%9E%9C">星桃果</a>）、对手损伤最大ＨＰ的树果（如<a href="https://wiki.52poke.com/zh-hans/%E5%98%89%E7%8F%8D%E6%9E%9C">嘉珍果</a>）。

熟成对以下树果无效（即使发动以下树果效果时仍然会显示特性信息）：
 •  治愈<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>状态的树果，例如：<a href="https://wiki.52poke.com/zh-hans/%E6%9C%A8%E5%AD%90%E6%9E%9C">木子果</a>等；
 •  <a href="https://wiki.52poke.com/zh-hans/%E9%87%8A%E9%99%80%E6%9E%9C">释陀果</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A5%87%E7%A7%98%E6%9E%9C">奇秘果</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%85%B0%E8%90%A8%E6%9E%9C">兰萨果</a>。
