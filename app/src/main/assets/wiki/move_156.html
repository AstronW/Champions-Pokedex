睡觉能够回复使用者全部的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。睡觉会使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>状态。

如果自身处于睡眠状态（如使用<a href="dex://entity/move:214">梦话</a>使出），或者具有特性<a href="https://wiki.52poke.com/zh-hans/%E7%BB%9D%E5%AF%B9%E7%9D%A1%E7%9C%A0">绝对睡眠</a>或<a href="dex://entity/ability:272">洁净之盐</a>之类的让自己无法入睡的特性，睡觉会使用失败。

ＨＰ为全满时使用会失败。
