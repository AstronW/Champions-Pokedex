自身的属性在使用招式之前变为所使用的招式的属性。转换属性的效果持续直到离开场地为止。每一次出场只能转换属性一次，需要替换后再次出场才能再次转换。对于两种属性的宝可梦，触发自由者时变为只有一种属性。该特性的宝可梦使用招式后，属性一致加成会以改变后的属性提升招式威力。

<a href="dex://entity/move:165">挣扎</a>不会触发自由者特性。

该特性的宝可梦使用招式后，<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>会根据改变后的属性提升招式威力。

当招式<b>使用失败</b>时，不会触发自由者；但是招式<b>没有命中</b>或被<b><a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a></b>时，仍会触发自由者。

<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8C%96">太晶化</a>的宝可梦使用招式时不会触发自由者。
