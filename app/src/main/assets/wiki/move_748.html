令使用者的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>和<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>提升1级。使用者进入<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E6%B3%95%E9%80%83%E8%B5%B0">无法逃走</a>状态。

 •  由于使用该招式而处于<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E6%B3%95%E9%80%83%E8%B5%B0">无法逃走</a>状态时再次使用该招式会失败。
 •  由于其他招式（例如<a href="dex://entity/move:212">黑色目光</a>）而处于<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E6%B3%95%E9%80%83%E8%B5%B0">无法逃走</a>状态时可以多次成功使出该招式，但无法逃走状态不会叠加。
