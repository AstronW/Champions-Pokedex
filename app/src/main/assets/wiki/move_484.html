攻击目标造成伤害。如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%B0%8F">变小</a>状态，<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>翻倍。同时在这种状况下，重磅冲撞一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

对<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>的宝可梦无效。
