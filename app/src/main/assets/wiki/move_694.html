
5回合内我方宝可梦受到的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%AE%8A%E6%8B%9B%E5%BC%8F">特殊招式</a>和<a href="https://wiki.52poke.com/zh-hans/%E7%89%A9%E7%90%86%E6%8B%9B%E5%BC%8F">物理招式</a>伤害减半，如果己方场上存在多只宝可梦则降低原本的<sup>1</sup>⁄<sub>3</sub>。

只有天气为<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E9%9B%B9">冰雹</a>或<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%AA">下雪</a>时才能成功使用。
 • 若双方场地上存在特性为<a href="dex://entity/ability:13">无关天气</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E9%97%B8">气闸</a>的宝可梦时，无论是否存在相应天气，招式使用失败。

极光幕不会因天气的改变而消失。
