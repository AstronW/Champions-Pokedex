陷入蓄力状态，-{zh-hans:在蓄力的时候，防御和特防会提高。;zh-hant:在蓄力的期间，防御和特防会提高。}-

令使用者的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>提升1级。

令使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>提升1级。

储存的力量可以被<a href="dex://entity/move:255">喷出</a>和<a href="dex://entity/move:256">吞下</a>，这个情况下，通过储存招式提升的能力将恢复原状。最多可以储存3次力量，但若自身离开场地则储存的力量会消失。如果无法提升能力，依然可以储存力量。但如果已经储存了3次力量，则无法继续使用蓄力提升能力。

如果使用<a href="dex://entity/move:226">接棒</a>，能力提升可以传递，但储存的力量不会传递。
