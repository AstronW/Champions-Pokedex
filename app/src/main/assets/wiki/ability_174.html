一般属性招式变为冰属性招式，且威力变为1.2倍。原本就是冰属性的招式不受该特性影响，威力不会改变。

<a href="dex://entity/move:237">觉醒力量</a>、<a href="dex://entity/move:363">自然之恩</a>、<a href="dex://entity/move:449">制裁光砾</a>、<a href="dex://entity/move:546">高科技光炮</a>、<a href="dex://entity/move:686">觉醒之舞</a>和<a href="dex://entity/move:718">多属性攻击</a>这些会改变属性的一般属性招式会先改变自身属性，然后承受冰冻皮肤特性的判定。因此只要这些招式的最终属性不是一般属性，就既不会变成冰属性，也不会被增幅威力。

具有该特性的宝可梦进入<a href="https://wiki.52poke.com/zh-hans/%E8%BE%93%E7%94%B5">输电</a>状态后，使出的一般属性招式会变为电属性且不会被提升威力。

被该特性转化为冰属性的招式不会因为<a href="dex://entity/move:569">等离子浴</a>的效应变成电属性。

具有此特性的冰属性宝可梦使出的一般属性攻击招式具有<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>，并且能消耗<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E4%B9%8B%E5%AE%9D%E7%9F%B3">冰之宝石</a>增加招式威力。
