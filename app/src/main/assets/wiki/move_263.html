攻击目标造成伤害。

如果自身处于<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>或<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>的<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>下，<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>翻倍。

无视<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>导致的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>减半效果。
