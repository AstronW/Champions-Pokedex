
阻止对手连续使用相同的招式。当对手离开场地后该效果消失。

如果对手被<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E5%A4%B4%E5%B8%A6">讲究头带</a>、<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E5%9B%B4%E5%B7%BE">讲究围巾</a>、<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E7%9C%BC%E9%95%9C">讲究眼镜</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%AE%9A%E8%BA%AB%E6%B3%95">定身法</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%86%8D%E6%9D%A5%E4%B8%80%E6%AC%A1">再来一次</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%8C%91%E8%A1%85">挑衅</a>强制发动相同招式，或仅有上次使用的招式有<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>，则对手会使用<a href="dex://entity/move:165">挣扎</a>。如果自身没有继续使用无理取闹，目标在下回合可以使用其他招式。
