该特性的宝可梦不会陷入<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>状态。陷入混乱的宝可梦获得该特性时混乱状态消除。在该特性的宝可梦使用<a href="dex://entity/move:80">花瓣舞</a>、<a href="dex://entity/move:200">逆鳞</a>或者<a href="https://wiki.52poke.com/zh-hans/%E8%8A%AD%E4%BA%9A%E6%9E%9C">芭亚果</a>等使自身混乱后，混乱状态仍然消除。
该特性不受<a href="dex://entity/ability:22">威吓</a>影响。
