在ＨＰ全满时，对战中使用的飞行属性招式<a href="https://wiki.52poke.com/zh-hans/%E4%BC%98%E5%85%88%E5%BA%A6">优先度</a>+1。对原本优先度为正的招式及<a href="dex://entity/move:237">觉醒力量</a>、<a href="dex://entity/move:363">自然之恩</a>无效。

如果使用的招式本身优先度为0，经过疾风之翼的加成后优先度为正，则可以被<a href="dex://entity/move:501">快速防守</a>所抵挡。

疾风之翼对<a href="https://wiki.52poke.com/zh-hans/%EF%BC%BA%E6%8B%9B%E5%BC%8F">Ｚ招式</a>以及<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E6%8B%9B%E5%BC%8F">极巨招式</a>有效。如果宝可梦发动该特性并使用<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E9%80%9F%E4%BF%AF%E5%86%B2%E8%BD%B0%E7%83%88%E6%92%9E">极速俯冲轰烈撞</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%A3%9E%E5%86%B2">极巨飞冲</a>时，目标正处于<a href="https://wiki.52poke.com/zh-hans/%E5%BF%AB%E9%80%9F%E9%98%B2%E5%AE%88">快速防守</a>状态，攻击也能成功但伤害减少到原来的<sup>1</sup>⁄<sub>4</sub>。
