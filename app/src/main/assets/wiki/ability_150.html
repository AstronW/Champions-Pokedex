
登场时以对手对应位置的宝可梦为目标进入<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E8%BA%AB">变身</a>状态。在<a href="https://wiki.52poke.com/zh-hans/%E7%9A%87%E5%AE%B6%E5%AF%B9%E6%88%98">皇家对战</a>中，以该特性宝可梦的正对面位置为目标进入变身状态。

如果目标处于<a href="dex://entity/ability:149">幻觉</a>之下、变身状态、<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>的保护下，或者目标位置没有宝可梦，则变身者特性发动失败。

如果目标是<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8C%96">太晶化</a>的<a href="https://wiki.52poke.com/zh-hans/%E5%8E%84%E8%AF%A1%E6%A4%AA">厄诡椪</a>，或是自身已太晶化且目标是厄诡椪，则变身者特性发动失败。
如果目标是<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8C%96">太晶化</a>的<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E4%B9%90%E5%B7%B4%E6%88%88%E6%96%AF">太乐巴戈斯</a>，或是自身已太晶化且目标是太乐巴戈斯，则变身者特性发动失败。
