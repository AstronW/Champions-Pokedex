该特性的宝可梦不会陷入<a href="https://wiki.52poke.com/zh-hans/%E7%95%8F%E7%BC%A9">畏缩状态</a>。<a href="dex://entity/ability:104">破格</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%85%86%E7%BA%A7%E7%94%B5%E5%8E%8B">兆级电压</a>和<a href="https://wiki.52poke.com/zh-hans/%E6%B6%A1%E8%BD%AE%E7%81%AB%E7%84%B0">涡轮火焰</a>特性的宝可梦仍能使该特性的宝可梦畏缩。获得该特性并不能解除畏缩状态。
