该特性的宝可梦处于除<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>以外的<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>时，<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>提升50%，并无视<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>的非固定伤害类物理招式威力变为原本的50%效果。

该特性的宝可梦被冰冻时使用<a href="https://wiki.52poke.com/zh-hans/%E8%A7%A3%E9%99%A4%E5%86%B0%E5%86%BB%E7%8A%B6%E6%80%81%E7%9A%84%E6%8B%9B%E5%BC%8F">解除冰冻状态的招式</a>，攻击不会提升。
