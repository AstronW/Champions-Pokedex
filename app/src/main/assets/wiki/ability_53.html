当自己没有携带物品时，回合结束后获得在自己的非<a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E8%BF%9C%E7%A8%8B%E6%8B%9B%E5%BC%8F">远程招式</a>攻击范围内，对方宝可梦或同伴宝可梦于该回合使用或<a href="dex://entity/move:374">投掷</a>而消耗的携带物品。如果回合内对手宝可梦与同伴宝可梦均使用了道具，优先获得对手的道具。

同一回合内离场或陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>的宝可梦用掉的道具无法被捡拾，即使在该回合内又重新上场。

被<a href="https://wiki.52poke.com/zh-hans/%E7%83%A7%E5%B0%BD">烧尽</a>，<a href="dex://entity/move:365">啄食</a>，<a href="dex://entity/move:450">虫咬</a>，<a href="dex://entity/move:282">拍落</a>的道具无法被捡拾，因受到攻击而破裂的<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E7%90%83">气球</a>无法被捡拾。
