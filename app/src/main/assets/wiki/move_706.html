破坏对方场地的<a href="https://wiki.52poke.com/zh-hans/%E5%85%89%E5%A2%99">光墙</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E5%B0%84%E5%A3%81">反射壁</a>和<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%85%89%E5%B9%95">极光幕</a>，并攻击目标造成伤害。

不受<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E5%B0%84%E5%A3%81">反射壁</a>和<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%85%89%E5%B9%95">极光幕</a>的伤害降低影响。

如果精神之牙因为未<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7">属性</a>免疫、被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>等原因没能造成伤害，则对方场地的状态也不会被破坏。
