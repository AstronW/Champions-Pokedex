攻击目标造成伤害。

打雷有30%的几率使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>状态。

在天气为<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%99%B4%E5%A4%A9">大晴天</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%97%A5%E7%85%A7">大日照</a>状态下，打雷的<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>降低至50。在天气为<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%A8">下雨</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E9%9B%A8">大雨</a>状态下，打雷一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

可以击中处于<a href="https://wiki.52poke.com/zh-hans/%E7%A9%BA%E4%B8%AD">空中</a>状态的宝可梦。
