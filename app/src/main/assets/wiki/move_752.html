使场上所有的宝可梦携带的<a href="https://wiki.52poke.com/zh-hans/%E6%A0%91%E6%9E%9C">树果</a>都会被立即消耗掉。
以下情况会无法触发茶会的效果：
 • 若所有宝可梦消耗携带的树果；
 • 宝可梦处于<a href="https://wiki.52poke.com/zh-hans/%E7%A9%BA%E4%B8%AD">空中</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B0%B4%E4%B8%AD">水中</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E4%B8%8B">地下</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%BD%9C%E4%BC%8F">潜伏</a>状态；
 • 若处于<a href="https://wiki.52poke.com/zh-hans/%E8%BE%93%E7%94%B5">输电</a>状态时，茶会的使用效果对<a href="dex://entity/ability:10">蓄电</a>特性的宝可梦无效。

以下情况会依然触发茶会的效果：
 • 不符合使用树果的条件，例如满ＨＰ时携带回复ＨＰ的树果；
 • 即使场上有宝可梦的特性为<a href="dex://entity/ability:127">紧张感</a>或处于<a href="https://wiki.52poke.com/zh-hans/%E9%AD%94%E6%B3%95%E7%A9%BA%E9%97%B4">魔法空间</a>中。

如果场上没有宝可梦携带树果，茶会效果失败。
