攻击目标造成伤害，并解除目标的<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态。
 • 如果招式无效，则不会解除灼伤状态。例如：对<a href="dex://entity/ability:11">储水</a>的宝可梦不会解除灼伤状态。

对<a href="dex://entity/ability:43">隔音</a>特性的宝可梦无效。

该招式无视目标的<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态。
