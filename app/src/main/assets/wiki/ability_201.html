当<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>因受到<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB%E6%8B%9B%E5%BC%8F">攻击</a>变为<sup>1</sup>⁄<sub>2</sub>以下时，<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>会提高1个<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">等级</a>。该特性能重复触发。
 • 若ＨＰ是由于间接伤害而降为<sup>1</sup>⁄<sub>2</sub>以下（如<a href="https://wiki.52poke.com/zh-hans/%E5%AF%84%E7%94%9F%E7%A7%8D%E5%AD%90">寄生种子</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94">天气</a>伤害、因<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>而攻击自身、<a href="https://wiki.52poke.com/zh-hans/%E7%94%9F%E5%91%BD%E5%AE%9D%E7%8F%A0">生命宝珠</a>等），该特性不会触发。
