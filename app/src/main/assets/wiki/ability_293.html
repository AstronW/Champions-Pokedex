拥有该特性的宝可梦一方，每有一只宝可梦陷入过<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，该特性的宝可梦的招式威力提升10%，上限为50%。
 • 若己方无宝可梦陷入濒死状态，则入场时不会发动该特性。
 • 在双打对战中，该特性发动后，友方宝可梦倒下并不会使招式威力进一步提升。
 • 进入战斗之前的濒死宝可梦不参与计算。
 • 拥有该特性的宝可梦自身陷入濒死状态也会参与计算，且不会重置特性效果。
 • 在对战中复活不会降低特性提升的数值。
 • 在<a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E4%BA%BA%E5%AF%B9%E6%88%98">多人对战</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%9B%A2%E4%BD%93%E6%88%98">太晶团体战</a>中，同伴训练家的宝可梦陷入濒死状态不参与计算。
