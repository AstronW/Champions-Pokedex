<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>对攻击招式威力的提升从原本的1.5倍提升至2倍。

如果具有此特性的宝可梦进行了<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8C%96">太晶化</a>，则:
 • 适应力只影响太晶属性的招式，如果太晶属性是自身原属性之一，则提升为2.25倍，否则为2倍；
 • 星晶属性招式不受适应力影响。
