攻击目标造成伤害。

急速折返使用成功时，使用者与后备宝可梦<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E6%8D%A2%E5%AE%9D%E5%8F%AF%E6%A2%A6">替换</a>，除非使用者是<a href="https://wiki.52poke.com/zh-hans/%E5%90%8C%E8%A1%8C%E5%AE%9D%E5%8F%AF%E6%A2%A6">同行宝可梦</a>中唯一没有陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态的宝可梦。

若当回合使用者被<a href="dex://entity/move:228">追打</a>定为目标，且使用者先行动，则退场前会受到翻倍威力的追打攻击。

即使自身受到<a href="https://wiki.52poke.com/zh-hans/%E6%89%8E%E6%A0%B9">扎根</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9D%9F%E7%BC%9A">束缚</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E6%B3%95%E9%80%83%E8%B5%B0">无法逃走</a>或<a href="dex://entity/ability:23">踩影</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E7%A9%B4">沙穴</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%A3%81%E5%8A%9B">磁力</a>的影响，也可以替换宝可梦。

若急速折返使目标发动了携带的<a href="https://wiki.52poke.com/zh-hans/%E9%80%83%E8%84%B1%E6%8C%89%E9%94%AE">逃脱按键</a>，则使用者不会退场。

急速折返使目标陷入濒死状态时，不影响使用者的替换。
