攻击目标造成伤害。

臂贝武器有20%的几率使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>状态。

若<b><sup>使用者的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a></sup>⁄<sub>目标的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a></sub>＞<sup>使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a></sup>⁄<sub>目标的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a></sub></b>，则招式为<a href="https://wiki.52poke.com/zh-hans/%E7%89%A9%E7%90%86%E6%8B%9B%E5%BC%8F">物理招式</a>，且是<a href="https://wiki.52poke.com/zh-hans/%E6%8E%A5%E8%A7%A6%E7%B1%BB%E6%8B%9B%E5%BC%8F">接触类招式</a>；

若<b><sup>使用者的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a></sup>⁄<sub>目标的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a></sub>＜<sup>使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a></sup>⁄<sub>目标的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a></sub></b>，则招式为<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%AE%8A%E6%8B%9B%E5%BC%8F">特殊招式</a>，且不是接触类招式；

若<b>两侧相等</b>，则随机为物理或特殊招式。

 • <b>判定招式类型时</b>，仅考虑双方的<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B">能力</a>和<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>，不考虑<a href="https://wiki.52poke.com/zh-hans/%E5%85%89%E5%A2%99">光墙</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E5%B0%84%E5%A3%81">反射壁</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%85%89%E5%B9%95">极光幕</a>、双方<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%80%A7">特性</a>、双方携带的<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态、特定属性宝可梦在天气下防御或特防提高等影响。
