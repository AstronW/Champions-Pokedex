攻击目标造成伤害。

如果自身上一回合因<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>或<a href="https://wiki.52poke.com/zh-hans/%E7%8A%B6%E6%80%81%E5%8F%98%E5%8C%96">状态变化</a>而无法行动，或者使用的招式失败、没有<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>目标或者对目标没有效果，则本回合使用跺脚时，<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>翻倍。

上一回合使用的招式被目标使用<a href="dex://entity/move:182">守住</a>等招式阻挡后不会触发跺脚的威力翻倍效果。
