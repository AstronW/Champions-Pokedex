该特性的宝可梦出场后，察觉全部对手携带的<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>。如果对手没有携带物品，则不会出现任何提示。如果对手有携带物品，则会有一个提示出现：<b>&lt;宝可梦的名字&gt;察觉到了&lt;对手宝可梦的名字&gt;的&lt;道具名称&gt;！</b>如果对手不止一个，还会出现提示：<b>连&lt;对手宝可梦的名字&gt;-{zh-hans:携带的;zh-hant:的}-&lt;道具名称&gt;也察觉到了！</b>。

对手交换宝可梦后，不管交换上场的宝可梦有没有携带道具，特性均无法发动。
