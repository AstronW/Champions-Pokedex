当该宝可梦登场时，<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94">天气</a>转为<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%AA">下雪</a>并持续5回合。
 •  在携带了道具<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E5%86%B7%E5%B2%A9%E7%9F%B3">冰冷岩石</a>的情况下，下雪会持续8回合。
 •  在<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E9%9B%A8">大雨</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%97%A5%E7%85%A7">大日照</a>和<a href="https://wiki.52poke.com/zh-hans/%E4%B9%B1%E6%B5%81">乱流</a>天气下，特性发动失败。
 •  如果有多只拥有可更换天气特性的宝可梦同时登场，那么将会按照宝可梦的<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>依次发动特性改变天气，后者覆盖前者。发动失败的情况下除外。
