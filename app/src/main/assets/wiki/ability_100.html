在其他宝可梦使用的招式的<a href="https://wiki.52poke.com/zh-hans/%E4%BC%98%E5%85%88%E5%BA%A6">优先度</a>与自身使用的招式的优先度相同的情况下，拥有该特性的宝可梦一定后使用招式。当多只宝可梦同时具有该特性时，优先度仍由<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>低的先使用招式。

慢出特性在场上宝可梦携带有<a href="https://wiki.52poke.com/zh-hans/%E5%90%8E%E6%94%BB%E4%B9%8B%E5%B0%BE">后攻之尾</a>与<a href="https://wiki.52poke.com/zh-hans/%E9%A5%B1%E8%85%B9%E8%96%B0%E9%A6%99">饱腹薰香</a>时无效。该特性的宝可梦携带了<a href="https://wiki.52poke.com/zh-hans/%E5%85%88%E5%88%B6%E4%B9%8B%E7%88%AA">先制之爪</a>或<a href="https://wiki.52poke.com/zh-hans/%E9%87%8A%E9%99%80%E6%9E%9C">释陀果</a>并触发时，慢出不影响其效果。

慢出特性的宝可梦与<a href="https://wiki.52poke.com/zh-hans/%E6%88%8F%E6%B3%95%E7%A9%BA%E9%97%B4">戏法空间</a>同时在场，慢出特性的宝可梦仍最后使用招式。

获得或失去该特性，被无特性覆盖或解除无特性，该特性的影响在操作的下一回合才能生效。
