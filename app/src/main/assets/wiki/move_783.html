气场轮击中对手后，使用者速度提升1个等级。在招式<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">没有命中</a>、对对方<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E7%9B%B8%E5%85%8B%E8%A1%A8">没有效果</a>或对方处于<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>，不会令使用者速度提升。

气场轮随特性为<a href="dex://entity/ability:258">饱了又饿</a>的<a href="https://wiki.52poke.com/zh-hans/%E8%8E%AB%E9%B2%81%E8%B4%9D%E5%8F%AF">莫鲁贝可</a>的形态而改变属性：在<a href="https://wiki.52poke.com/zh-hans/%E5%BD%A2%E6%80%81%E5%8F%98%E5%8C%96%23%E8%8E%AB%E9%B2%81%E8%B4%9D%E5%8F%AF">满腹花纹</a>时会变成电属性，在空腹花纹时则会变成恶属性；在莫鲁贝可<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>后，也同样根据当前花纹，变成<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%97%AA%E7%94%B5">极巨闪电</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E6%81%B6%E9%9C%B8">极巨恶霸</a>。

仅在使用者为莫鲁贝可（或其他宝可梦<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E8%BA%AB">变身</a>为莫鲁贝可）时奏效，否则使用失败。
