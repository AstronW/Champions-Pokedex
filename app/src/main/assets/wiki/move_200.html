攻击随机一位对手造成伤害。

使用者进入2～3回合逆鳞状态，期间会继续使用逆鳞进行攻击，无法使用其他<a href="https://wiki.52poke.com/zh-hans/%E6%8B%9B%E5%BC%8F">招式</a>、使用<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E6%8D%A2%E5%AE%9D%E5%8F%AF%E6%A2%A6">替换宝可梦</a>或<a href="https://wiki.52poke.com/zh-hans/%E9%80%83%E8%B5%B0">逃走</a>。

因<a href="dex://entity/move:214">梦话</a>而使用时，不进入逆鳞状态。

因<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态、未<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>、属性相性无效等原因而没有产生效果，则解除逆鳞状态。

逆鳞状态因回合经过解除时，使用者陷入<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>状态。

<a href="https://wiki.52poke.com/zh-hans/%E7%A5%9E%E7%A7%98%E5%AE%88%E6%8A%A4">神秘守护</a>不会避免该招式带来的混乱。

后续回合的攻击不消耗<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>。
