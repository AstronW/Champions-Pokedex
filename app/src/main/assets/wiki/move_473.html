攻击目标造成伤害。

使用目标的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>代替目标的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>进行<a href="https://wiki.52poke.com/zh-hans/%E4%BC%A4%E5%AE%B3">伤害</a>计算。

防守方能影响精神冲击伤害的因素：
 • 防御<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>；
 • <a href="dex://entity/move:113">光墙</a>

防守方不能影响精神冲击伤害的因素：
 • 特防<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>；
 • <a href="https://wiki.52poke.com/zh-hans/%E7%AA%81%E5%87%BB%E8%83%8C%E5%BF%83">突击背心</a>
 • <a href="dex://entity/move:115">反射壁</a>

其他相关能力变化与特殊招式相同，此外<a href="dex://entity/move:243">镜面反射</a>可以反弹其招式。
