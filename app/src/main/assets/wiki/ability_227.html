
透过在脚下张开<a href="https://wiki.52poke.com/zh-hans/%E7%B2%BE%E7%A5%9E%E5%9C%BA%E5%9C%B0">精神场地</a>，布下精神场地，持续5回合。让在<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E9%9D%A2%E4%B8%8A%E7%9A%84%E5%AE%9D%E5%8F%AF%E6%A2%A6">地面上的宝可梦</a>所持的超能力属性招式的威力提升，且不会受到对手<a href="https://wiki.52poke.com/zh-hans/%E5%85%88%E5%88%B6%E6%8B%9B%E5%BC%8F">先制招式</a>的攻击以及<a href="https://wiki.52poke.com/zh-hans/%E4%BC%98%E5%85%88%E5%BA%A6">优先度</a>+1以上<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%8C%96%E6%8B%9B%E5%BC%8F">变化招式</a>之影响。
 •  携带了道具<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E5%9C%B0%E8%86%9C">大地膜</a>的情况下，<a href="https://wiki.52poke.com/zh-hans/%E7%B2%BE%E7%A5%9E%E5%9C%BA%E5%9C%B0">精神场地</a>会持续8回合。
