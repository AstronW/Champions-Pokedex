拥有该特性的宝可梦受到冰属性或火属性招式攻击时，在伤害计算中对方的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>或<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>减半。
 •  此效果<b>不是<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a></b>。
 •  不影响<a href="https://wiki.52poke.com/zh-hans/%E5%9B%BA%E5%AE%9A%E4%BC%A4%E5%AE%B3%E7%B1%BB%E6%8B%9B%E5%BC%8F">固定伤害类招式</a>的伤害。不影响<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>的伤害。
 •  仅第四世代，拥有该特性的宝可梦受到冰属性或火属性招式攻击时，此招式的<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>变为原来的<sup>1</sup>⁄<sub>2</sub>。
