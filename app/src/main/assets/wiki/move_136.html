攻击目标造成伤害。

如果招式未命中、被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态阻挡，因为属性相性或特性而没有产生效果，自身承受最大ＨＰ的<sup>1</sup>⁄<sub>2</sub>（向下取整）的反作用力伤害。

使用者具有<a href="dex://entity/ability:98">魔法防守</a>特性时，招式没有产生效果时使用者不会承受伤害。

使用者具有<a href="dex://entity/ability:120">舍身</a>特性时，该招式威力提升20%。



如果场上存在<a href="https://wiki.52poke.com/zh-hans/%E9%87%8D%E5%8A%9B">重力</a>作用，则无法使用该招式。
