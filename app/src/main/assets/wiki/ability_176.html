<a href="https://wiki.52poke.com/zh-hans/%E5%9D%9A%E7%9B%BE%E5%89%91%E6%80%AA">坚盾剑怪</a>使用攻击招式时会变为<a href="https://wiki.52poke.com/zh-hans/%E5%9D%9A%E7%9B%BE%E5%89%91%E6%80%AA"><span></span></a>刀剑形态，当使用<a href="dex://entity/move:588">王者盾牌</a>时变为<a href="https://wiki.52poke.com/zh-hans/%E5%9D%9A%E7%9B%BE%E5%89%91%E6%80%AA"><span></span></a>盾牌形态，使用其余的<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%8C%96%E6%8B%9B%E5%BC%8F">变化招式</a>，形态不会改变。若招式由<a href="dex://entity/move:214">梦话</a>抽取到，形态也会改变。

战斗切换在自己使用招式前发动，该判定于一些可能导致无法行动的状态（如<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>）之后。

战斗切换不能被<a href="dex://entity/move:285">特性互换</a>交换，不受<a href="https://wiki.52poke.com/zh-hans/%E7%9B%AE%E6%A0%87%E7%89%B9%E6%80%A7%E6%94%B9%E5%8F%98%E7%9A%84%E6%8B%9B%E5%BC%8F">目标特性改变的招式</a>和<a href="dex://entity/ability:152">木乃伊</a>特性的影响，也不能被<a href="dex://entity/move:272">扮演</a>招式或<a href="dex://entity/ability:36">复制</a>特性复制。

使用招式<a href="dex://entity/move:144">变身</a>或发动特性<a href="dex://entity/ability:150">变身者</a>获得战斗切换特性的宝可梦无法改变形态。
