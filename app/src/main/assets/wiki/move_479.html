



攻击目标造成伤害，并使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E5%87%BB%E8%90%BD">击落</a>状态。如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E7%94%B5%E7%A3%81%E9%A3%98%E6%B5%AE">电磁飘浮</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%84%8F%E5%BF%B5%E7%A7%BB%E7%89%A9">意念移物</a>状态，则解除这两个状态。陷入击落状态的宝可梦将被视为<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E9%9D%A2%E4%B8%8A%E7%9A%84%E5%AE%9D%E5%8F%AF%E6%A2%A6">地面上的宝可梦</a>。

可以击中处于<a href="https://wiki.52poke.com/zh-hans/%E7%A9%BA%E4%B8%AD">空中</a>状态的宝可梦，并解除目标的空中状态，令目标无法使出正在<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>。
