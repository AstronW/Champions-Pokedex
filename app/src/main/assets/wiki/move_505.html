治愈波动能够回复目标<sup>1</sup>⁄<sub>2</sub>的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。在目标处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态时无法使用。

治愈波动一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

招式使用者拥有<a href="dex://entity/ability:178">超级发射器</a>特性时，回复量上升为最大ＨＰ的<sup>3</sup>⁄<sub>4</sub>。
