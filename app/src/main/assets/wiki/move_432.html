令目标的<a href="https://wiki.52poke.com/zh-hans/%E9%97%AA%E9%81%BF%E7%8E%87">闪避率</a>降低1级。清除场上的<a href="https://wiki.52poke.com/zh-hans/%E8%B5%B7%E9%9B%BE">起雾</a>天气。

只要此招式成功使出，无论是否降低了目标的闪避率，都会移除目标场地上的<a href="https://wiki.52poke.com/zh-hans/%E7%99%BD%E9%9B%BE">白雾</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%85%89%E5%A2%99">光墙</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E5%B0%84%E5%A3%81">反射壁</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%85%89%E5%B9%95">极光幕</a>和<a href="https://wiki.52poke.com/zh-hans/%E7%A5%9E%E7%A7%98%E5%AE%88%E6%8A%A4">神秘守护</a>，移除双方场地上<a href="https://wiki.52poke.com/zh-hans/%E5%AF%B9%E5%85%A5%E5%9C%BA%E5%AE%9D%E5%8F%AF%E6%A2%A6%E7%94%9F%E6%95%88%E7%9A%84%E6%8B%9B%E5%BC%8F">入场可生效的状态</a>和<a href="https://wiki.52poke.com/zh-hans/%E5%9C%BA%E5%9C%B0%E5%9E%8B%E7%8A%B6%E6%80%81">场地型状态</a>。<a href="https://wiki.52poke.com/zh-hans/%E6%97%B7%E9%87%8E%E5%9C%B0%E5%B8%A6">旷野地带</a>、<a href="https://wiki.52poke.com/zh-hans/%EF%BC%92%EF%BC%91%EF%BC%90%E5%8F%B7%E9%81%93%E8%B7%AF%EF%BC%88%E7%A5%9E%E5%A5%A5%EF%BC%89">２１０号道路（神奥）</a>等地点自然生成的<a href="https://wiki.52poke.com/zh-hans/%E5%9C%BA%E5%9C%B0%E5%9E%8B%E7%8A%B6%E6%80%81">场地型状态</a>无法被清除。

如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态，则虽然闪避率不会降低，但后续效果仍然发生。

清除浓雾一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

如果对手被<a href="https://wiki.52poke.com/zh-hans/%E7%99%BD%E9%9B%BE">白雾</a>保护，则对手闪避率不会降低，但白雾随之被清除。
