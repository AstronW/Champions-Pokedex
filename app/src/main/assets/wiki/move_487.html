将目标的属性组合变成单一水属性。目标离场后效果解除。

无法改变拥有<a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E5%B1%9E%E6%80%A7">多属性</a>、<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A1%EF%BC%B2%E7%B3%BB%E7%BB%9F">ＡＲ系统</a>特性或处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态的宝可梦的属性。

无法改变<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8C%96">太晶化</a>的宝可梦的属性。

该状态不能被<a href="dex://entity/move:226">接棒</a>传递。

若<a href="https://wiki.52poke.com/zh-hans/%E9%87%8E%E7%94%9F%E5%AE%9D%E5%8F%AF%E6%A2%A6">野生宝可梦</a>的属性受到浸水的影响，使用<a href="https://wiki.52poke.com/zh-hans/%E6%8D%95%E7%BD%91%E7%90%83">捕网球</a>也能提高<a href="https://wiki.52poke.com/zh-hans/%E6%8D%95%E8%8E%B7%E7%8E%87">捕获率</a>。
