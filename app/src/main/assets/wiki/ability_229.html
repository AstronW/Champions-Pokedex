
通过在脚下张开<a href="https://wiki.52poke.com/zh-hans/%E9%9D%92%E8%8D%89%E5%9C%BA%E5%9C%B0">青草场地</a>，布下青草场地，持续5回合。让在<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E9%9D%A2%E4%B8%8A%E7%9A%84%E5%AE%9D%E5%8F%AF%E6%A2%A6">地面上的宝可梦</a>所持的草属性招式的威力提升，且在每一回合ＨＰ会逐渐回复。此外，因<a href="dex://entity/move:89">地震</a>、<a href="dex://entity/move:222">震级</a>或<a href="dex://entity/move:523">重踏</a>的招式造成的伤害将会减半。
 •  携带了道具<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E5%9C%B0%E8%86%9C">大地膜</a>的情况下，<a href="https://wiki.52poke.com/zh-hans/%E9%9D%92%E8%8D%89%E5%9C%BA%E5%9C%B0">青草场地</a>会持续8回合。
