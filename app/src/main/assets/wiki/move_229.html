攻击目标造成伤害。

令使用者的<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>提升1级。 

只要此招式成功使出，会移除己方场地上的<a href="https://wiki.52poke.com/zh-hans/%E5%AF%B9%E5%85%A5%E5%9C%BA%E5%AE%9D%E5%8F%AF%E6%A2%A6%E7%94%9F%E6%95%88%E7%9A%84%E6%8B%9B%E5%BC%8F">入场可生效的状态</a>；摆脱自身<a href="https://wiki.52poke.com/zh-hans/%E6%9D%9F%E7%BC%9A">束缚</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%AF%84%E7%94%9F%E7%A7%8D%E5%AD%90">寄生种子</a>状态。

如果招式使用失败，或使用者因目标的<a href="https://wiki.52poke.com/zh-hans/%E5%87%B8%E5%87%B8%E5%A4%B4%E7%9B%94">凸凸头盔</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%93%81%E5%88%BA">铁刺</a>、<a href="dex://entity/ability:24">粗糙皮肤</a>等而<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>，则无法移除和摆脱。
