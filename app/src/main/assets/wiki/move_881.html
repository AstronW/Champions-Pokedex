包括使用的回合在内，接下来5回合的<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94">天气</a>变更为<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%AA">下雪</a>。然后自身与后备宝可梦<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E6%8D%A2%E5%AE%9D%E5%8F%AF%E6%A2%A6">替换</a>。
 • 如果使用者携带了<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E5%86%B7%E5%B2%A9%E7%9F%B3">冰冷岩石</a>，天气持续时间延长为8回合。
 • 使用该招式会覆盖原本的天气。如果当前天气已经为下雪，招式没有效果，但使用者自身仍退场。
 • 如果自身是<a href="https://wiki.52poke.com/zh-hans/%E5%90%8C%E8%A1%8C%E5%AE%9D%E5%8F%AF%E6%A2%A6">同行</a>中唯一没有陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态的宝可梦，则不会退场，但天气仍变更为下雪。
 • 即使自身受到<a href="https://wiki.52poke.com/zh-hans/%E6%89%8E%E6%A0%B9">扎根</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9D%9F%E7%BC%9A">束缚</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E6%B3%95%E9%80%83%E8%B5%B0">无法逃走</a>或<a href="dex://entity/ability:23">踩影</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E7%A9%B4">沙穴</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%A3%81%E5%8A%9B">磁力</a>的影响，也可以替换宝可梦。
