结束与<a href="https://wiki.52poke.com/zh-hans/%E9%87%8E%E7%94%9F%E5%AE%9D%E5%8F%AF%E6%A2%A6">野生宝可梦</a>的对战，如果使用者的等级低于目标，招式使用失败。

在训练家的对战中，令对方队伍中随机一只没有陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态的宝可梦强制替换上场。

以下情况时，招式没有效果：
 • 目标特性为<a href="dex://entity/ability:21">吸盘</a>、<a href="dex://entity/ability:275">看门犬</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B9%98%E9%A3%8E">乘风</a>或<a href="dex://entity/ability:283">黄金之躯</a>；
 • 目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%89%8E%E6%A0%B9">扎根</a>状态；
 • 对方队伍中没有可以替换上场的宝可梦；
 • 目标为<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>的宝可梦。

吹飞一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

该招式无视目标的<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态。
