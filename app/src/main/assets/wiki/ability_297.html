具有该特性的宝可梦不受地面属性招式的影响，当被地面属性的招式击中时，回复最大<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>的<sup>1</sup>⁄<sub>4</sub>。
 • 该特性只能令自身不受地面属性招式的影响，不能将地面属性招式的目标转移至自身。
 • 该特性对地面属性的<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%8C%96%E6%8B%9B%E5%BC%8F">变化招式</a>有效。包括通过其他方式变为地面属性的变化招式。
 • 对于<a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>，只会触发1次特性效果。
 • 触发该特性时，与没有效果相同，不会发动招式的<a href="https://wiki.52poke.com/zh-hans/%E8%BF%BD%E5%8A%A0%E6%95%88%E6%9E%9C">追加效果</a>。
 • 该特性的宝可梦进入<a href="dex://entity/move:182">守住</a>状态无法通过被地面属性招式击中回复ＨＰ。
