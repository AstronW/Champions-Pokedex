该特性的宝可梦在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%A8">下雨</a>时，该回合最后会解除所有<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>。

处于<a href="https://wiki.52poke.com/zh-hans/%E7%9E%8C%E7%9D%A1">瞌睡</a>状态的该特性宝可梦，由于回合结束时，先触发湿润之躯，因此在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%A8">下雨</a>时也会进入<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>，睡眠后的下一回合若还在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%A8">下雨</a>，则可触发湿润之躯解除<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>。
