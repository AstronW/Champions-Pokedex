攻击目标造成伤害。我方每有一只宝可梦陷入过<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，招式的威力提升50，上限为5050&lt;ref&gt;[https://twitter.com/Sibuna_Switch/status/1599145066152357888?s=20&amp;t=exyVf1k02gFEy09hy-jgAA 扫墓最大威力]&lt;/ref&gt;。
 • 进入战斗之前的濒死宝可梦不会增加招式威力。
 • 使用者自身陷入濒死状态也会增加招式威力，且不会重置威力。
 • 在对战中复活不会降低招式威力。
 • 在<a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E4%BA%BA%E5%AF%B9%E6%88%98">多人对战</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%9B%A2%E4%BD%93%E6%88%98">太晶团体战</a>中，同伴训练家的宝可梦陷入濒死状态不会增加招式威力。
