攻击目标造成伤害。

如果目标在本回合没有选择<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB%E6%8B%9B%E5%BC%8F">攻击招式</a>或<a href="dex://entity/move:382">抢先一步</a>，或本回合已经行动，则突袭会使用失败。
 • 只考虑目标是否选择了相应的招式，而不考虑目标的招式能否使用成功。

如果目标是<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%9B%A2%E4%BD%93%E6%88%98">极巨团体战</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%9B%A2%E4%BD%93%E6%88%98">太晶团体战</a>中的野生宝可梦，就算其一回合内使用的多个招式中包含了攻击招式，只要第一次使用的招式是<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%8C%96%E6%8B%9B%E5%BC%8F">变化招式</a>，突袭就会使用失败。

如果对方使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>（无论当回合是在进行蓄力或进行攻击），不考虑其他情况下，突袭都能使用成功，但是否命中需要另外判定。
