使用招式以该特性的宝可梦或以<a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E4%BD%9C%E7%94%A8%E8%8C%83%E5%9B%B4%E4%B8%BA%E5%85%A8%E9%83%A8%E5%9C%BA%E5%9C%B0%E7%9A%84%E6%8B%9B%E5%BC%8F">全场</a>为目标时，每有一只该特性的宝可梦，多损失1点<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>。友方宝可梦使用招式时则不会触发该特性。

 •  该特性不受<a href="dex://entity/ability:104">破格</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%85%86%E7%BA%A7%E7%94%B5%E5%8E%8B">兆级电压</a>和<a href="https://wiki.52poke.com/zh-hans/%E6%B6%A1%E8%BD%AE%E7%81%AB%E7%84%B0">涡轮火焰</a>特性影响。

 •  无论招式是否命中或有效，该效果都会生效。例如被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>阻挡、<a href="https://wiki.52poke.com/zh-hans/%E5%B9%BD%E7%81%B5">幽灵</a>属性宝可梦受到<a href="dex://entity/move:370">近身战</a>的攻击等。
 •  •  <a href="dex://entity/move:797">广域战力</a>和<a href="dex://entity/move:751">龙箭</a>攻击时，只计算选择位置宝可梦可能的压迫感，至多只会多损失1点ＰＰ。

 •  对手使用<a href="dex://entity/move:191">撒菱</a>、<a href="dex://entity/move:390">毒菱</a>、<a href="dex://entity/move:446">隐形岩</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%8A%A2%E5%A4%BA">抢夺</a>、<a href="dex://entity/move:286">封印</a>时也会触发该特性。

 •  对手使用<a href="dex://entity/move:851">太晶爆发</a>时，即使目标不是持有该特性的宝可梦，也同样会受到该特性影响。
