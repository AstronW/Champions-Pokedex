<a href="https://wiki.52poke.com/zh-hans/%E6%90%BA%E5%B8%A6%E7%89%A9%E5%93%81">携带物品</a>的能力失效（包括负面效果）。

拥有笨拙特性的宝可梦无法使用<a href="dex://entity/move:374">投掷</a>，但能够使用<a href="dex://entity/move:415">掉包</a>及<a href="dex://entity/move:271">戏法</a>。

如果该特性的宝可梦使用能通过道具改变招式属性的招式时（如<a href="dex://entity/move:449">制裁光砾</a>），招式为一般属性。

以下道具依然有效：
 • <a href="https://wiki.52poke.com/zh-hans/%E8%B6%85%E7%BA%A7%E7%9F%B3">超级石</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9C%B1%E7%BA%A2%E8%89%B2%E5%AE%9D%E7%8F%A0">朱红色宝珠</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%9D%9B%E8%93%9D%E8%89%B2%E5%AE%9D%E7%8F%A0">靛蓝色宝珠</a>和<a href="https://wiki.52poke.com/zh-hans/%EF%BC%BA%E7%BA%AF%E6%99%B6">Ｚ纯晶</a>；
 • 影响<a href="https://wiki.52poke.com/zh-hans/%E5%9F%BA%E7%A1%80%E7%82%B9%E6%95%B0">基础点数</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%BB%8F%E9%AA%8C%E5%80%BC">经验值</a>和<a href="https://wiki.52poke.com/zh-hans/%E4%BA%B2%E5%AF%86%E5%BA%A6">亲密度</a>的携带物品（如<a href="https://wiki.52poke.com/zh-hans/%E6%8A%A4%E7%AC%A6%E9%87%91%E5%B8%81">护符金币</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%B9%B8%E8%BF%90%E8%9B%8B">幸运蛋</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%8A%9B%E9%87%8F%E8%B4%9F%E9%87%8D">力量负重</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%AE%89%E6%8A%9A%E4%B9%8B%E9%93%83">安抚之铃</a>等）；
 • 携带物品的对战外效果（如<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8D%E5%8F%98%E4%B9%8B%E7%9F%B3">不变之石</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B4%81%E5%87%80%E4%B9%8B%E7%AC%A6">洁净之符</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A4%B4%E5%B7%BE">头巾</a>等）。
