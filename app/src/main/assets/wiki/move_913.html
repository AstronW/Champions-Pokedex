<h2>对战内</h2>
令除使用者外己方全场的<a href="https://wiki.52poke.com/zh-hans/%E5%87%BB%E4%B8%AD%E8%A6%81%E5%AE%B3%E7%8E%87">击中要害率</a>提升1级。同伴具有龙属性时击中要害率提升2级。
 • 场上每只宝可梦的击中要害率最多提升1次。

该招式对处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态的同伴有效。
