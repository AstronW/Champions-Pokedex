令目标的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD%E7%8E%87">命中率</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%97%AA%E9%81%BF%E7%8E%87">闪避率</a>中随机一项能力提升2级。

如果已经有能力不能提升，则它不会被随机选择。如果任何能力都不能提升则招式失败。

如果目标具有<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>，则招式使用失败，除非招式目标是自身。

如果使用者陷入<a href="https://wiki.52poke.com/zh-hans/%E5%86%8D%E6%9D%A5%E4%B8%80%E6%AC%A1">再来一次</a>状态，招式目标强制指定为自身。

如果使用者场地处于<a href="https://wiki.52poke.com/zh-hans/%E6%88%8F%E6%B3%95%E9%98%B2%E5%AE%88">戏法防守</a>状态，目标为伙伴时招式失败。
