其他宝可梦对自身造成<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">剧毒</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>时，自身对那只宝可梦造成相同的<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>。

若特性为同步的宝可梦同时携带可以治愈它异常状态的树果，那么触发树果效果前触发同步特性。

若处于异常状态的非同步特性宝可梦对特性为同步的宝可梦使用<a href="dex://entity/move:375">精神转移</a>，同步特性会在异常状态被治愈之前触发，使得特性发动失败，前者的异常状态可以解除。

两只宝可梦连续因为同步而触发，但是字幕会显示同步失败。

以下情况<b>不会</b>触发同步特性：
 • 若由于接触到<a href="https://wiki.52poke.com/zh-hans/%E6%AF%92%E8%8F%B1">毒菱</a>而陷入中毒状态；
 • 若由于携带到<a href="https://wiki.52poke.com/zh-hans/%E5%89%A7%E6%AF%92%E5%AE%9D%E7%8F%A0">剧毒宝珠</a>或<a href="https://wiki.52poke.com/zh-hans/%E7%81%AB%E7%84%B0%E5%AE%9D%E7%8F%A0">火焰宝珠</a>而陷入中毒或灼伤状态。
