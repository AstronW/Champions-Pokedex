使用招式攻击对手造成伤害时，对方有10%几率陷入<a href="https://wiki.52poke.com/zh-hans/%E7%95%8F%E7%BC%A9">畏缩</a>状态。
 •  该效果与<a href="https://wiki.52poke.com/zh-hans/%E7%8E%8B%E8%80%85%E4%B9%8B%E8%AF%81">王者之证</a>／<a href="https://wiki.52poke.com/zh-hans/%E9%94%90%E5%88%A9%E4%B9%8B%E7%89%99">锐利之牙</a>不叠加。
 •  该效果与特效为<a href="https://wiki.52poke.com/zh-hans/%E7%95%8F%E7%BC%A9">畏缩</a>的招式（比如<a href="dex://entity/move:403">空气斩</a>）不叠加。
 • <a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>每一下连续的攻击都会有相同的几率造成对手畏缩。
