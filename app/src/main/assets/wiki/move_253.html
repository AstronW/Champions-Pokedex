

攻击随机一位对手造成伤害。

使用者进入3回合吵闹状态，期间会继续使用吵闹进行攻击，无法使用其他<a href="https://wiki.52poke.com/zh-hans/%E6%8B%9B%E5%BC%8F">招式</a>、使用<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E6%8D%A2%E5%AE%9D%E5%8F%AF%E6%A2%A6">替换宝可梦</a>或<a href="https://wiki.52poke.com/zh-hans/%E9%80%83%E8%B5%B0">逃走</a>。

吵闹不会被<a href="dex://entity/move:214">梦话</a>发动。

因<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态、未<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>、属性相性无效等原因而没有产生效果，则解除吵闹状态。

后续回合的攻击不消耗<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>。

该招式无视目标的<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态。

<a href="https://wiki.52poke.com/zh-hans/%E5%90%B5%E9%97%B9">吵闹</a>状态的宝可梦在场时，所有宝可梦都不会陷入<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>状态，已经陷入睡眠状态的宝可梦也会醒来。
