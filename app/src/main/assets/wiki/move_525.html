攻击目标造成伤害，并结束与<a href="https://wiki.52poke.com/zh-hans/%E9%87%8E%E7%94%9F%E5%AE%9D%E5%8F%AF%E6%A2%A6">野生宝可梦</a>的对战。如果使用者的等级低于目标，则强制结束对战的效果无效。

在训练家的对战中，攻击后会令对方队伍中随机一只没有陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态的宝可梦强制替换上场。

以下情况时，结束对战或强制替换的效果无效：
 • 目标特性为<a href="dex://entity/ability:21">吸盘</a>或<a href="dex://entity/ability:275">看门犬</a>；
 • 目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%89%8E%E6%A0%B9">扎根</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态；
 • 对方队伍中没有可以替换上场的宝可梦；
 • 目标为<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>的宝可梦。

若使用该招式的一方因对方的<a href="https://wiki.52poke.com/zh-hans/%E5%87%B8%E5%87%B8%E5%A4%B4%E7%9B%94">凸凸头盔</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%93%81%E5%88%BA">铁刺</a>等而濒死时，该招式的强制替换上场的效果无效。
