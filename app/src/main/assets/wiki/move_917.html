

攻击目标造成伤害，使目标在2回合内陷入<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态。

阻止目标使用<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%EF%BC%A8%EF%BC%B0%E7%9A%84%E6%8B%9B%E5%BC%8F">回复ＨＰ的招式</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%90%B8%E5%8F%96%EF%BC%A8%EF%BC%B0%E7%9A%84%E6%8B%9B%E5%BC%8F">吸取ＨＰ的招式</a>的效果属于<a href="https://wiki.52poke.com/zh-hans/%E8%BF%BD%E5%8A%A0%E6%95%88%E6%9E%9C">追加效果</a>，可以被目标的<a href="dex://entity/ability:19">鳞粉</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%AF%86%E6%8E%A2%E6%96%97%E7%AF%B7">密探斗篷</a>防止，也能够发动使用者的<a href="dex://entity/ability:125">强行</a>特性。
