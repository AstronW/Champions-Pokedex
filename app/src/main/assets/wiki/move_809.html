探知目标<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>进行攻击，该效果不会消耗目标的道具。

如果目标没有携带<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>，或者特性为<a href="dex://entity/ability:103">笨拙</a>时，招式使用失败。

 •  该招式对无法移除的道具（如<a href="https://wiki.52poke.com/zh-hans/%E8%8B%8D%E5%93%8D">苍响</a>携带的<a href="https://wiki.52poke.com/zh-hans/%E8%85%90%E6%9C%BD%E7%9A%84%E5%89%91">腐朽的剑</a>）同样有效。

 •  若对手携带的道具因本次攻击而触发，如<a href="https://wiki.52poke.com/zh-hans/%E4%BD%9B%E6%9F%91%E6%9E%9C">佛柑果</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%80%83%E8%84%B1%E6%8C%89%E9%94%AE">逃脱按键</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%BC%B1%E7%82%B9%E4%BF%9D%E9%99%A9">弱点保险</a>，招式仍然使用成功；若道具触发时机更早，则使用失败。

 •  在<a href="https://wiki.52poke.com/zh-hans/%E9%AD%94%E6%B3%95%E7%A9%BA%E9%97%B4">魔法空间</a>下，该招式对携带道具的目标依然有效。

使用招式后的提示为：「<b>对手的 [宝可梦的名字] 被 [对手宝可梦的道具] 袭击了！</b>」
