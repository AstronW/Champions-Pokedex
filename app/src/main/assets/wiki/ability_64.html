该特性的宝可梦受到<a href="https://wiki.52poke.com/zh-hans/%E5%90%B8%E5%8F%96%EF%BC%A8%EF%BC%B0%E7%9A%84%E6%8B%9B%E5%BC%8F">吸取ＨＰ的攻击招式</a>的攻击时，攻击方本应回复的ＨＰ会改为受到同等的伤害。

该特性的宝可梦被<a href="https://wiki.52poke.com/zh-hans/%E5%AF%84%E7%94%9F%E7%A7%8D%E5%AD%90">寄生种子状态</a>吸取ＨＰ时，吸取方本应回复的ＨＰ会改为受到同等的伤害。

如果攻击方携带<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%A0%B9%E8%8C%8E">大根茎</a>，攻击方受到的伤害为会根据大根茎原本吸取提升而增加伤害。
