电磁波会使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>状态。

电磁波对于<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E7%9B%B8%E5%85%8B%E8%A1%A8">属性相性</a>是0倍的目标无效。例如：
 •  电磁波（正常情况下）对地面属性宝可梦无效；
 •  电磁波（<a href="https://wiki.52poke.com/zh-hans/%E4%B8%80%E8%88%AC%E7%9A%AE%E8%82%A4">一般皮肤</a>）对幽灵属性宝可梦无效。
