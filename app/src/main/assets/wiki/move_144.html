<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E5%A4%B4%E5%B8%A6">讲究头带</a>、<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E5%9B%B4%E5%B7%BE">讲究围巾</a>和<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E7%9C%BC%E9%95%9C">讲究眼镜</a>的效果依然有效，自身需要选择新的招式。

该招式不能被<a href="dex://entity/move:119">鹦鹉学舌</a>学习（<a href="https://wiki.52poke.com/zh-hans/%E7%AC%AC%E4%BA%8C%E4%B8%96%E4%BB%A3">第二世代</a>起），也不能被<a href="https://wiki.52poke.com/zh-hans/%E5%86%8D%E6%9D%A5%E4%B8%80%E6%AC%A1">再来一次</a>强制发动。

如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%88%8F%E6%B3%95%E9%98%B2%E5%AE%88">戏法防守</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E8%BA%AB">变身</a>或<a href="dex://entity/ability:149">幻觉</a>的保护下，招式使用失败。

变身对具有<a href="dex://entity/ability:283">黄金之躯</a>特性的宝可梦无效。

如果目标是<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8C%96">太晶化</a>的<a href="https://wiki.52poke.com/zh-hans/%E5%8E%84%E8%AF%A1%E6%A4%AA">厄诡椪</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E4%B9%90%E5%B7%B4%E6%88%88%E6%96%AF">太乐巴戈斯</a>，或是自身已太晶化且目标是厄诡椪、太乐巴戈斯，招式使用失败。

自身已太晶化且太晶属性为<a href="https://wiki.52poke.com/zh-hans/%E6%98%9F%E6%99%B6">星晶</a>时，招式使用失败。
