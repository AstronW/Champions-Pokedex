攻击随机一位对手造成<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E5%B1%9E%E6%80%A7">无属性</a>的伤害。对使用者造成最大ＨＰ的<sup>1</sup>⁄<sub>4</sub>伤害。

挣扎一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

该招式不能被<a href="dex://entity/move:102">模仿</a>或<a href="dex://entity/move:166">写生</a>学习，也不能被<a href="dex://entity/move:383">仿效</a>、<a href="dex://entity/move:119">鹦鹉学舌</a>、<a href="dex://entity/move:274">借助</a>或<a href="dex://entity/move:118">挥指</a>发动，也不受<a href="https://wiki.52poke.com/zh-hans/%E5%86%8D%E6%9D%A5%E4%B8%80%E6%AC%A1">再来一次</a>、<a href="dex://entity/ability:69">坚硬脑袋</a>、<a href="dex://entity/ability:120">舍身</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%A5%9E%E5%A5%87%E5%AE%88%E6%8A%A4">神奇守护</a>、<a href="dex://entity/ability:98">魔法防守</a>的影响。

该招式不可被<a href="https://wiki.52poke.com/zh-hans/%E7%B2%BE%E9%80%9A%E6%8B%9B%E5%BC%8F">精通</a>。
