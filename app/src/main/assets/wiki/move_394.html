攻击目标造成伤害。使用者承受对目标造成伤害的<sup>1</sup>⁄<sub>3</sub>的伤害。

使用者具有<a href="dex://entity/ability:69">坚硬脑袋</a>或<a href="dex://entity/ability:98">魔法防守</a>特性时，不会承受伤害。

使用者具有<a href="dex://entity/ability:120">舍身</a>特性时，该招式威力提升20%，因此承受的伤害也会提升。

闪焰冲锋有10%的几率使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态。

处于<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E5%86%BB">冰冻</a>状态的宝可梦，无论是否命中，只要成功使用该招式，就可以解除冰冻。
