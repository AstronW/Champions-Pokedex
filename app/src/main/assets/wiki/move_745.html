攻击原本选定的目标，无视<a href="dex://entity/move:502">交换场地</a>、场上<a href="https://wiki.52poke.com/zh-hans/%E4%B8%87%E4%BC%97%E7%9E%A9%E7%9B%AE">万众瞩目</a>状态、<a href="https://wiki.52poke.com/zh-hans/%E5%BC%95%E6%B0%B4">引水</a>、<a href="dex://entity/ability:31">避雷针</a>、对手宝可梦的交换。

只有目标不在场上时，才攻击同位置宝可梦。

攻击目标造成伤害。<a href="https://wiki.52poke.com/zh-hans/%E5%87%BB%E4%B8%AD%E8%A6%81%E5%AE%B3%23%E5%87%BB%E4%B8%AD%E8%A6%81%E5%AE%B3%E7%8E%87">击中要害率</a>比大部分招式高1级。

该招式被<a href="dex://entity/move:118">挥指</a>发动时会因挥指的目标为自身而使用失败。
