该特性的宝可梦每一回合都会在<a href="https://wiki.52poke.com/zh-hans/%E8%8E%AB%E9%B2%81%E8%B4%9D%E5%8F%AF"><span></span></a>满腹花纹和<a href="https://wiki.52poke.com/zh-hans/%E8%8E%AB%E9%B2%81%E8%B4%9D%E5%8F%AF"><span></span></a>空腹花纹之间改变自身的样子。

<a href="dex://entity/move:783">气场轮</a>会根据不同形态变为不同的属性，在满腹花纹时是电属性的招式，在空腹花纹时则会变成恶属性的招式。

该特性在宝可梦太晶化后不再发动。宝可梦不再每一回合改变自身的样子，而是维持太晶化前的样子。
