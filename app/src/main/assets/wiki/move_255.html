攻击目标造成伤害。威力相当于<a href="dex://entity/move:254">蓄力</a>的次数乘100。储存的力量会被喷出，且储存的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>和<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>会被复原。如果自身没有储存力量，则招式使用失败。

即使对方正在使用蓄力招式不在场上，使用此招式也会复原储存的力量，只是招式不会造成伤害。

该招式不会被<a href="dex://entity/move:119">鹦鹉学舌</a>学习。
