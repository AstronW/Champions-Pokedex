当拥有甜幕特性的宝可梦在场时，不让己方在场中的宝可梦进入<a href="https://wiki.52poke.com/zh-hans/%E7%9E%8C%E7%9D%A1">瞌睡</a>或<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>状态。

已经处于<a href="https://wiki.52poke.com/zh-hans/%E7%9E%8C%E7%9D%A1">瞌睡</a>状态的宝可梦受到甜幕保护后，不会因为<a href="https://wiki.52poke.com/zh-hans/%E7%9E%8C%E7%9D%A1">瞌睡</a>而进入<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>状态。
