攻击目标造成伤害。

暴风雪有10%的几率使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E5%86%BB">冰冻</a>状态。

在<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E9%9B%B9">冰雹</a>或<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%AA">下雪</a>天气下，暴风雪一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。
