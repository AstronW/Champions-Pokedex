拥有此特性的宝可梦在被<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB%EF%BC%88%E7%8A%B6%E6%80%81%EF%BC%89">击倒</a>时，给对手带来与自身被最后一击之前同等<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>的伤害。
 •  如果具有该特性的宝可梦并非直接被击倒，那么不会给对手带来伤害。
 •  如果具有该特性的宝可梦被<a href="dex://entity/move:248">预知未来</a>或<a href="dex://entity/move:353">破灭之愿</a>击倒，而且此时招式的使用者不在场上，那么不会给另外的对手带来伤害。
 •  如果具有该特性的宝可梦被<a href="dex://entity/move:331">种子机关枪</a>或<a href="dex://entity/move:594">飞水手里剑</a>等连续攻击招击倒，那么将会带来从第一击到击倒前的所有伤害。
 •  如果对手可以被具有该特性的宝可梦以此特性击倒，即使对手有<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E6%8A%AB%E5%B8%A6">气势披带</a>，也无法保留1ＨＰ。
 •  如果双方只有一只宝可梦的情况，拥有该特性的宝可梦被击倒但因为飞出的内在物造成对方同时倒下，拥有该特性的宝可梦一方算失败。
