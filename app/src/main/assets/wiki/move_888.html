攻击目标造成伤害，一回合内连续攻击2次。

每一击<a href="https://wiki.52poke.com/zh-hans/%E5%87%BB%E4%B8%AD%E8%A6%81%E5%AE%B3">击中要害</a>的概率都相等。

如果第一下触发了目标的<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E6%8A%AB%E5%B8%A6">气势披带</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E5%A4%B4%E5%B8%A6">气势头带</a>、<a href="dex://entity/ability:5">结实</a>特性或打破了<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>，招式会继续攻击。

<a href="dex://entity/move:117">忍耐</a>、<a href="dex://entity/move:368">金属爆炸</a>和<a href="dex://entity/move:243">镜面反射</a>只计算最后一次的伤害。

如果使用者持有<a href="https://wiki.52poke.com/zh-hans/%E7%8E%8B%E8%80%85%E4%B9%8B%E8%AF%81">王者之证</a>或<a href="https://wiki.52poke.com/zh-hans/%E9%94%90%E5%88%A9%E4%B9%8B%E7%89%99">锐利之牙</a>，或具有<a href="dex://entity/ability:1">恶臭</a>特性，每一下攻击都有相同的概率造成对手<a href="https://wiki.52poke.com/zh-hans/%E7%95%8F%E7%BC%A9">畏缩</a>。

如果目标拥有<a href="dex://entity/ability:130">诅咒之躯</a>特性，每一下攻击都会触发效果。即使特性发动令攻击方陷入一些可能无法行动的状态（如<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%95%8F%E7%BC%A9">畏缩</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%9D%80%E8%BF%B7">着迷</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%AE%9A%E8%BA%AB%E6%B3%95">定身法</a>状态），也不会影响本次攻击，但陷入<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>和<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>时攻击即刻停止。

目标的<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E8%89%B2">变色</a>特性在最后一下攻击完成后才发动。
