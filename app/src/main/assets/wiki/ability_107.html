对战开始时，当对手拥有<a href="https://wiki.52poke.com/zh-hans/%E6%95%88%E6%9E%9C%E7%BB%9D%E4%BD%B3">效果绝佳</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B8%80%E5%87%BB%E5%BF%85%E6%9D%80%E6%8B%9B%E5%BC%8F">一击必杀招式</a>、<a href="dex://entity/move:120">自爆</a>或<a href="dex://entity/move:153">大爆炸</a>时会发出警告：<b>&lt;宝可梦的名字&gt;发抖了！</b>。

其中把<a href="dex://entity/move:449">制裁光砾</a>、<a href="dex://entity/move:311">气象球</a>、<a href="dex://entity/move:363">自然之恩</a>、<a href="dex://entity/move:68">双倍奉还</a>、<a href="dex://entity/move:368">金属爆炸</a>、<a href="dex://entity/move:243">镜面反射</a>、<a href="dex://entity/move:546">高科技光炮</a>、<a href="dex://entity/move:718">多属性攻击</a>、<a href="dex://entity/move:686">觉醒之舞</a>、<a href="dex://entity/move:805">大地波动</a>都视作游戏中显示的属性。

危险预知不把<a href="https://wiki.52poke.com/zh-hans/%E4%B9%B1%E6%B5%81">乱流</a>下的属性相性计入。

<a href="dex://entity/move:573">冷冻干燥</a>被视作冰属性招式，对水属性宝可梦造成的效果绝佳不考虑在内。

<a href="dex://entity/move:560">飞身重压</a>被视作格斗属性招式，飞行属性的相性不考虑在内。
