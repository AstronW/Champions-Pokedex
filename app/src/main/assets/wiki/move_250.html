

攻击目标造成伤害。

如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%B0%B4%E4%B8%AD">水中</a>状态，<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>翻倍。

可以击中处于<a href="https://wiki.52poke.com/zh-hans/%E6%B0%B4%E4%B8%AD">水中</a>状态的宝可梦。

使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E6%9D%9F%E7%BC%9A">束缚</a>状态。束缚状态持续4～5回合，处于束缚状态的宝可梦会持续受到伤害并不能换下。

招式的施放方离场时效果解除。
