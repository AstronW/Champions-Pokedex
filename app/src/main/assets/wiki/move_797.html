一般情况下，攻击目标为除自身以外场上任意一只可以攻击到的宝可梦（包括队友）。

在<a href="https://wiki.52poke.com/zh-hans/%E7%B2%BE%E7%A5%9E%E5%9C%BA%E5%9C%B0">精神场地</a>上，若使用者为<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E9%9D%A2%E4%B8%8A%E7%9A%84%E5%AE%9D%E5%8F%AF%E6%A2%A6">地面上的宝可梦</a>，会产生<b>攻击目标变为全部能攻击到的对手宝可梦，威力进一步提升50%</b>的附加效果，精神场地本身提升的30％额外计算。

发动附加效果后，能产生以下结果：
 •  即使原本攻击目标为队友，攻击目标同样变为全部能攻击到的对方宝可梦。
 •  即使原本攻击目标为恶属性宝可梦或进入<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态，广域战力也能攻击到其他对手宝可梦。
 •  广域战力可以被<a href="https://wiki.52poke.com/zh-hans/%E5%B9%BF%E5%9F%9F%E9%98%B2%E5%AE%88">广域防守</a>阻挡。
