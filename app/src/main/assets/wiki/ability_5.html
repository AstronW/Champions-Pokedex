<a href="https://wiki.52poke.com/zh-hans/%E4%B8%80%E5%87%BB%E5%BF%85%E6%9D%80%E7%9A%84%E6%8B%9B%E5%BC%8F">一击必杀的招式</a>对拥有该特性的宝可梦无效。

拥有该特性的宝可梦在满ＨＰ状态下受到一次攻击时，至少会保留1点ＨＰ。
 • 受到<a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>时，第一次攻击就会使结实特性发动或不再满足发动条件，无法对后续攻击生效。
 • 无法抵御<a href="https://wiki.52poke.com/zh-hans/%E9%80%A0%E6%88%90%E8%87%AA%E8%BA%AB%E9%99%B7%E5%85%A5%E6%BF%92%E6%AD%BB%E7%8A%B6%E6%80%81%E7%9A%84%E6%8B%9B%E5%BC%8F">造成自身陷入濒死状态的招式</a>所导致的自身<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>效果。
 • 无法阻止<a href="https://wiki.52poke.com/zh-hans/%E5%90%8C%E5%91%BD">同命</a>状态生效。

该特性的宝可梦携带<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E6%8A%AB%E5%B8%A6">气势披带</a>受到了一击被击倒的招式，优先触发结实特性的效果，不会消耗气势披带。

该特性的宝可梦受到过伤害后，如果HP回复到全满，能够再次触发特性。
