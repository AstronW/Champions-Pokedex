攻击目标造成伤害。对使用者造成最大ＨＰ的<sup>1</sup>⁄<sub>2</sub>（向上取整）伤害。

如果使用者自身ＨＰ不足<sup>1</sup>⁄<sub>2</sub>，这会导致使用者陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>。

即使招式未命中、被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态阻挡，由于属性相性或特性而没有产生效果，使用者仍然会受到伤害。

目标已经陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>且对手场上没有任何宝可梦时，此招式使用失败，使用者不会受到伤害。

如果双方同时因为此招式陷入濒死，则使用者会先倒下，因此在对战中如果使用此招式导致双方均没有可以战斗的宝可梦，使用者会输掉这场对战。

使用者的<a href="dex://entity/ability:98">魔法防守</a>特性会防止此招式对使用者伤害；使用者的<a href="dex://entity/ability:120">舍身</a>、<a href="dex://entity/ability:69">坚硬脑袋</a>特性对此招式无效。
