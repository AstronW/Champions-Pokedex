拥有该特性的宝可梦不会受到其他宝可梦以该特性宝可梦为目标（之一）的<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%8C%96%E6%8B%9B%E5%BC%8F">变化招式</a>的影响，例如：<a href="dex://entity/move:195">灭亡之歌</a>。

包括己方的其他宝可梦对该特性宝可梦使用变化招式依然无效，例如：<a href="dex://entity/move:270">帮助</a>。

该特性宝可梦<b>依然会</b>受到以下招式的影响：
 • 作用于该特性宝可梦一方场地的招式，例如：<a href="dex://entity/move:446">隐形岩</a>；
 • 作用于全部场地的招式，例如：<a href="dex://entity/move:114">黑雾</a>、<a href="dex://entity/move:433">戏法空间</a>。
