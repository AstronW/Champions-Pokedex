该特性的宝可梦食用<a href="https://wiki.52poke.com/zh-hans/%E6%A0%91%E6%9E%9C">树果</a>时可触发原本的效果，同时额外恢复<sup>1</sup>⁄<sub>3</sub><a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。若处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>时，无法恢复ＨＰ。

训练家从<a href="https://wiki.52poke.com/zh-hans/%E5%8C%85%E5%8C%85">包包</a>里拿出来使用的树果对该特性无效。
