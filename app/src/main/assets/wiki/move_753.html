
使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E6%B3%95%E9%80%83%E8%B5%B0">无法逃走</a>和<a href="https://wiki.52poke.com/zh-hans/%E8%9B%B8%E5%9B%BA">蛸固</a>状态。处于无法逃走状态的宝可梦不能换下。

处于蛸固状态的宝可梦每回合的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>和<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>降低1级。

蛸固对幽灵属性宝可梦无效：既不能令幽灵属性的目标无法逃走，也无法降低其能力，同时不播放招式动画。
