攻击目标造成伤害，自身的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>恢复“造成的伤害×50%”。在攻击方携带<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%A0%B9%E8%8C%8E">大根茎</a>时，攻击伤害不变，ＨＰ恢复量提高到“造成的伤害×65%”。

如果攻击方处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态，<a href="https://wiki.52poke.com/zh-hans/%E5%90%B8%E5%8F%96%EF%BC%A8%EF%BC%B0%E7%9A%84%E6%8B%9B%E5%BC%8F">招式使用失败</a>。

使用刷刷茶炮攻击<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态下的宝可梦可以恢复ＨＰ。

刷刷茶炮有20%的几率使目标陷入<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态。

处于<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E5%86%BB">冰冻</a>状态的宝可梦，无论是否命中，只要成功使用该招式，就可以解除冰冻。<br>
 •  被该招式击中也会被解冻。
