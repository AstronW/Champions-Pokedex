在一回合内先聚气再攻击目标造成伤害。

聚气优先度为+5，攻击优先度为-3。聚气后如果在发动攻击前受到伤害，则招式会失败。

该招式不会被<a href="dex://entity/move:274">借助</a>、<a href="dex://entity/move:118">挥指</a>或<a href="dex://entity/move:214">梦话</a>发动。

<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>的野生宝可梦使用此招式时，即使在发动攻击前受到伤害，也能够正常使出该招式。
