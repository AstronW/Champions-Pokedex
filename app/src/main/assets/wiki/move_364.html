攻击目标造成伤害，并在本回合结束前取消目标的<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态，或者目标全场的<a href="https://wiki.52poke.com/zh-hans/%E5%B9%BF%E5%9F%9F%E9%98%B2%E5%AE%88">广域防守</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%BF%AB%E9%80%9F%E9%98%B2%E5%AE%88">快速防守</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%88%8F%E6%B3%95%E9%98%B2%E5%AE%88">戏法防守</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%8E%80%E6%A6%BB%E6%A6%BB%E7%B1%B3">掀榻榻米</a>的效果，但无法击破<a href="dex://entity/move:203">挺住</a>的效果。

即使目标没有被守住，招式也可以造成伤害。

在被幽灵属性免疫时，无法击破守住状态。

使用者不会受到<a href="dex://entity/move:588">王者盾牌</a>、<a href="dex://entity/move:596">尖刺防守</a>、<a href="dex://entity/move:661">碉堡</a>等造成守住状态的招式的其他影响。

该招式可以对使用<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%98%B2%E5%A3%81">极巨防壁</a>的目标造成伤害，但是不会击破<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%98%B2%E5%A3%81">极巨防壁</a>。
