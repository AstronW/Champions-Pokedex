攻击目标造成伤害。

如果当回合内自身<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>曾降低过，<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>翻倍。

以下情况<b>符合</b>触发威力翻倍效果的条件：
 •  在战斗开始时，由入场发动的特性导致的能力下降（例如对方的<a href="dex://entity/ability:22">威吓</a>）；
 •  •  即使该回合触发<a href="dex://entity/ability:172">好胜</a>、<a href="dex://entity/ability:128">不服输</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%BC%B1%E7%82%B9%E4%BF%9D%E9%99%A9">弱点保险</a>等，自身<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>相对回合开始上升，也能触发泄愤的效果。

以下情况<b>不符合</b>触发威力翻倍效果的条件：
 •  因受到<a href="dex://entity/move:114">黑雾</a>、<a href="dex://entity/move:499">清除之烟</a>、<a href="dex://entity/move:576">颠倒</a>、<a href="dex://entity/move:712">暗影偷盗</a>等招式或特性<a href="dex://entity/ability:261">怪药</a>影响造成的能力相对下降；
 •  在上回合结束时的能力下降（例如<a href="dex://entity/ability:141">心情不定</a>特性、招式使用者被<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E6%8D%A2%E5%AE%9D%E5%8F%AF%E6%A2%A6">替换</a>出场时受到<a href="https://wiki.52poke.com/zh-hans/%E9%BB%8F%E9%BB%8F%E7%BD%91">黏黏网</a>的影响、或者对方宝可梦被击倒后替换上拥有<a href="dex://entity/ability:22">威吓</a>特性的宝可梦等情况）。
