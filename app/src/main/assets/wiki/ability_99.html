该特性宝可梦使用的招式与以该特性宝可梦为目标的招式都一定会命中，包括在<a href="dex://entity/move:19">飞翔</a>、<a href="dex://entity/move:91">挖洞</a>等情况的宝可梦都可以被击中，除非这只宝可梦因<a href="https://wiki.52poke.com/zh-hans/%E5%8F%91%E5%8F%B7%E6%96%BD%E4%BB%A4">发号施令</a>特性在<a href="https://wiki.52poke.com/zh-hans/%E5%90%83%E5%90%BC%E9%9C%B8">吃吼霸</a>的口中。

只会影响命中，不能穿透<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%BF%AB%E9%80%9F%E9%98%B2%E5%AE%88">快速防守</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%B9%BF%E5%9F%9F%E9%98%B2%E5%AE%88">广域防守</a>的保护。
