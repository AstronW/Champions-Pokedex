<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD%E7%8E%87">命中率</a><a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>不会被对方以任何方式降低，无视目标<a href="https://wiki.52poke.com/zh-hans/%E9%97%AA%E9%81%BF%E7%8E%87">闪避率</a><a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>的提升。
 • 与能力变化无关的影响<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD%E5%88%A4%E5%AE%9A">命中判定</a>的效果（如<a href="https://wiki.52poke.com/zh-hans/%E5%A5%87%E8%BF%B9%E7%9A%AE%E8%82%A4">奇迹皮肤</a>、<a href="dex://entity/ability:8">沙隐</a>、<a href="dex://entity/ability:81">雪隐</a>等），不会受到发光特性的影响。

<h2>宝可梦不可思议迷宫系列</h2>
该特性的宝可梦受到攻击后，本层会多出1个对手。<b><sup><a href="https://wiki.52poke.com/zh-hans/%E5%AE%9D%E5%8F%AF%E6%A2%A6%E4%B8%8D%E5%8F%AF%E6%80%9D%E8%AE%AE%E8%BF%B7%E5%AE%AB%20%E8%B5%A4%E4%B9%8B%E6%95%91%E5%8A%A9%E9%98%9F%EF%BC%8F%E9%9D%92%E4%B9%8B%E6%95%91%E5%8A%A9%E9%98%9F"><span>R</span><span>B</span></a></sup></b><b><sup><a href="https://wiki.52poke.com/zh-hans/%E5%AE%9D%E5%8F%AF%E6%A2%A6%E4%B8%8D%E5%8F%AF%E6%80%9D%E8%AE%AE%E8%BF%B7%E5%AE%AB%20%E6%97%B6%E4%B9%8B%E6%8E%A2%E9%99%A9%E9%98%9F%EF%BC%8F%E6%9A%97%E4%B9%8B%E6%8E%A2%E9%99%A9%E9%98%9F"><span>T</span><span>D</span></a><a href="https://wiki.52poke.com/zh-hans/%E5%AE%9D%E5%8F%AF%E6%A2%A6%E4%B8%8D%E5%8F%AF%E6%80%9D%E8%AE%AE%E8%BF%B7%E5%AE%AB%20%E7%A9%BA%E4%B9%8B%E6%8E%A2%E9%99%A9%E9%98%9F"><span>S</span></a></sup></b>

该特性的宝可梦使用发光类招式（如<a href="dex://entity/move:109">奇异之光</a>、<a href="dex://entity/move:113">光墙</a>）后会进入“诱饵”状态。在有多个目标可以攻击时，敌人会优先攻击处于该状态的目标。此状态在5回合后或进入下一层时消失。<b><sup><a href="https://wiki.52poke.com/zh-hans/%E5%AE%9D%E5%8F%AF%E6%A2%A6%E8%B6%85%E7%BA%A7%E4%B8%8D%E5%8F%AF%E6%80%9D%E8%AE%AE%E8%BF%B7%E5%AE%AB"><span>SMD</span></a></sup></b>
