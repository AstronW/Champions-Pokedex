当同伴陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态后，无论是何原因，此宝可梦的特性变成与该同伴相同。自身离场时特性还原为接球手。

在<a href="https://wiki.52poke.com/zh-hans/%E5%8D%95%E6%89%93%E5%AF%B9%E6%88%98">单打对战</a>中，此特性没有作用。

 • <a href="https://wiki.52poke.com/zh-hans/%E7%A5%9E%E5%A5%87%E5%AE%88%E6%8A%A4">神奇守护</a>
 • <a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E6%97%A0%E6%B3%95%E8%A2%AB%E5%A4%8D%E5%88%B6%E7%9A%84%E7%89%B9%E6%80%A7">无法被复制的特性</a>
