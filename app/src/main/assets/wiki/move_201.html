
包括使用的回合在内，接下来5回合的<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94">天气</a>变更为<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E6%9A%B4">沙暴</a>。如果使用者携带了<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E6%B2%99%E5%B2%A9%E7%9F%B3">沙沙岩石</a>，持续时间延长为8回合。

使用该招式会覆盖原本的天气。无论原本的天气是否永续，该招式的效果结束之后天气都会恢复为晴朗。如果当前天气为<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E9%9B%A8%EF%BC%88%E5%A4%A9%E6%B0%94%EF%BC%89">大雨</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%97%A5%E7%85%A7%EF%BC%88%E5%A4%A9%E6%B0%94%EF%BC%89">大日照</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B9%B1%E6%B5%81">乱流</a>或已经为沙暴，招式使用失败。
