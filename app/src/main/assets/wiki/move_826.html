攻击目标造成伤害。

对手最后使用的招式的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>降低3点。

降低<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>的效果属于<a href="https://wiki.52poke.com/zh-hans/%E8%BF%BD%E5%8A%A0%E6%95%88%E6%9E%9C">追加效果</a>，可以被目标的<a href="dex://entity/ability:19">鳞粉</a>特性防止，也能够发动使用者的<a href="dex://entity/ability:125">强行</a>特性。

对于<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E6%8B%9B%E5%BC%8F">极巨招式</a>，减少其原始招式的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>。

对<a href="dex://entity/ability:43">隔音</a>特性的宝可梦无效。

该招式无视目标的<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态。
