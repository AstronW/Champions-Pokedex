在通常情况下，<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力</a>不会被对方及同伴的<a href="https://wiki.52poke.com/zh-hans/%E6%8B%9B%E5%BC%8F">招式</a>和<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%80%A7">特性</a>降低（例如招式<a href="dex://entity/move:184">鬼面</a>、特性<a href="dex://entity/ability:22">威吓</a>等）。

白色烟雾特性不能阻止以下能力的降低方式：
 •  自身使用降低自身能力的招式：<a href="dex://entity/move:276">蛮力</a>、<a href="dex://entity/move:359">臂锤</a>等；
 •  自身携带降低能力的<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>：<a href="https://wiki.52poke.com/zh-hans/%E9%BB%91%E8%89%B2%E9%93%81%E7%90%83">黑色铁球</a>等；
 •  降低能力的<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>：<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>；
 •  与对方平分能力的招式：<a href="dex://entity/move:470">防守平分</a>、<a href="dex://entity/move:471">力量平分</a>；
 •  与对方交换能力的招式：<a href="dex://entity/move:391">心灵互换</a>、<a href="dex://entity/move:385">防守互换</a>、<a href="dex://entity/move:384">力量互换</a>；
 •  与同行宝可梦传递能力的招式：<a href="dex://entity/move:226">接棒</a>；
 •  改变能力的招式：<a href="dex://entity/move:576">颠倒</a>；
 •  无视白色烟雾的特性：<a href="dex://entity/ability:104">破格</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B6%A1%E8%BD%AE%E7%81%AB%E7%84%B0">涡轮火焰</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%85%86%E7%BA%A7%E7%94%B5%E5%8E%8B">兆级电压</a>。
