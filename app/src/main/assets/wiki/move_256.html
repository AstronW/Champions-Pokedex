使用者<a href="dex://entity/move:254">蓄力</a>1次时，吞下能够回复使用者<sup>1</sup>⁄<sub>4</sub>的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。使用者蓄力2次时，吞下能够回复使用者<sup>1</sup>⁄<sub>2</sub>的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。使用者蓄力3次时，吞下能够回复使用者全部的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。在使用者处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态时无法使用。
