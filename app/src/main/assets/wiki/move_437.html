攻击目标造成伤害。

令使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>降低2级。
 •  如果攻击无效或没有命中，不会产生该效果。
 •  如果使用者的特性为<a href="dex://entity/ability:126">唱反调</a>，则使用者的特攻提升2级。
 •  使用者的<a href="dex://entity/move:54">白雾</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>或<a href="dex://entity/ability:73">白色烟雾</a>等无法阻止飞叶风暴的该副作用。
 •  <a href="dex://entity/ability:125">强行</a>、<a href="dex://entity/ability:128">不服输</a>、<a href="dex://entity/ability:172">好胜</a>对飞叶风暴的该副作用无效。
