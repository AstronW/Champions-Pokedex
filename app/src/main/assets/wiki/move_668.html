恢复使用者与目标<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>数值相同的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>值，该数值受到目标当前的攻击<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>影响，但降低攻击时触发的<a href="dex://entity/ability:128">不服输</a>不影响该数值。

令目标的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>降低1级。

在使用者处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>效果影响时或攻击能力变化已降至最低，该招式无法使用。

如果目标处于攻击<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>无法降低的状态（例如受到<a href="https://wiki.52poke.com/zh-hans/%E7%99%BD%E9%9B%BE">白雾</a>状态保护，受到<a href="dex://entity/ability:52">怪力钳</a>或<a href="dex://entity/ability:29">恒净之躯</a>等特性影响），则无法降低对手的能力变化，但仍然能够吸取ＨＰ。
