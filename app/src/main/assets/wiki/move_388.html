将目标的特性变更为<a href="dex://entity/ability:15">不眠</a>。目标离场后效果结束。

截至第六世代，烦恼种子对<a href="https://wiki.52poke.com/zh-hans/%E8%BE%BE%E6%91%A9%E6%A8%A1%E5%BC%8F">达摩模式</a>特性的宝可梦有效，失去达摩模式特性的同时会失去已经变化的形态；第七世代起，烦恼种子对<a href="https://wiki.52poke.com/zh-hans/%E8%BE%BE%E6%91%A9%E6%A8%A1%E5%BC%8F">达摩模式</a>特性的宝可梦无效。

目标特性为<a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E6%97%A0%E6%B3%95%E8%A2%AB%E8%A6%86%E7%9B%96%E7%9A%84%E7%89%B9%E6%80%A7">无法被覆盖的特性</a>时，烦恼种子使用失败，包括：
 • <a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E5%B1%9E%E6%80%A7">多属性</a>、<a href="https://wiki.52poke.com/zh-hans/%E8%BE%BE%E6%91%A9%E6%A8%A1%E5%BC%8F">达摩模式</a>、<a href="dex://entity/ability:176">战斗切换</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%BE%A4%E8%81%9A%E5%8F%98%E5%BD%A2">群聚变形</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B5%E7%BB%8A%E5%8F%98%E8%BA%AB">牵绊变身</a>、<a href="dex://entity/ability:209">画皮</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%B1%BC%E7%BE%A4">鱼群</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%95%8C%E9%99%90%E7%9B%BE%E5%A3%B3">界限盾壳</a>、<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A1%EF%BC%B2%E7%B3%BB%E7%BB%9F">ＡＲ系统</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B8%80%E5%8F%A3%E5%AF%BC%E5%BC%B9">一口导弹</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%BB%93%E5%86%BB%E5%A4%B4">结冻头</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%BA%BA%E9%A9%AC%E4%B8%80%E4%BD%93">人马一体</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%BB%9D%E5%AF%B9%E7%9D%A1%E7%9C%A0">绝对睡眠</a>、<a href="dex://entity/ability:278">全能变身</a>和<a href="https://wiki.52poke.com/zh-hans/%E5%A4%AA%E6%99%B6%E5%8F%98%E5%BD%A2">太晶变形</a>。

目标特性为<a href="https://wiki.52poke.com/zh-hans/%E6%87%92%E6%83%B0">懒惰</a>时，烦恼种子使用失败。
