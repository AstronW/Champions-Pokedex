拥有该特性的宝可梦受到火属性招式造成的伤害降低50%，不会陷入<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态，并且水属性招式的威力变为原来的两倍。

已经处于<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态的宝可梦因<a href="dex://entity/move:285">特性互换</a>等招式获得此特性后可以治愈<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>。
