拥有该特性的宝可梦使用招式攻击目标时，无视目标<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>和<a href="https://wiki.52poke.com/zh-hans/%E9%97%AA%E9%81%BF%E7%8E%87">闪避率</a>的<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>；受到目标的招式攻击时，无视目标的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>和<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD%E7%8E%87">命中率</a>的能力变化。

 • 拥有该特性的宝可梦使用<a href="dex://entity/move:492">欺诈</a>攻击目标时，无视目标<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>的能力变化；受到<a href="dex://entity/move:492">欺诈</a>攻击时，无视自身<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>的能力变化。
 • 拥有该特性的宝可梦受到<a href="dex://entity/move:776">扑击</a>攻击时，无视目标<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>的能力变化。
 • 该特性只在<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>和<a href="https://wiki.52poke.com/zh-hans/%E4%BC%A4%E5%AE%B3">伤害</a>的计算过程中无视目标的能力变化，故：
 •  • 不会影响因能力变化而改变的<a href="dex://entity/move:360">陀螺球</a>、<a href="dex://entity/move:486">电球</a>、<a href="dex://entity/move:500">辅助力量</a>、<a href="dex://entity/move:681">嚣张</a>和<a href="dex://entity/move:386">惩罚</a>等招式的威力；
 •  • 使用<a href="dex://entity/move:668">吸取力量</a>回复的ＨＰ会根据目标<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>的能力变化而计算。
 • 因<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>而攻击自身时，不会无视自身的能力变化。
