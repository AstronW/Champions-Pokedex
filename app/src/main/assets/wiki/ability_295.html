拥有该特性的宝可梦受到<a href="https://wiki.52poke.com/zh-hans/%E7%89%A9%E7%90%86%E6%8B%9B%E5%BC%8F">物理招式</a>攻击时，会向对手的场地撒下<a href="https://wiki.52poke.com/zh-hans/%E6%AF%92%E8%8F%B1">毒菱</a>，使交换上场的宝可梦<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>。

可撒下两层毒菱，使交换上场的宝可梦进入<a href="https://wiki.52poke.com/zh-hans/%E5%89%A7%E6%AF%92">剧毒</a>状态。
 • 对手场地上已有两层毒菱时，该特性不会触发。
 • <a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>的每一击都会触发此特性。
 • 受到<a href="dex://entity/move:229">高速旋转</a>或<a href="dex://entity/move:866">晶光转转</a>攻击时，会先触发该特性撒下毒菱，然后毒菱被移除。
