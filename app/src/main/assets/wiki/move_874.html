攻击目标造成伤害。

每命中一个目标，向地上投掷5×使用者等级的金币。如果己方在对战中获胜，拾取这些金币，每个转换为<span>$</span>1。

己方携带了<a href="https://wiki.52poke.com/zh-hans/%E6%8A%A4%E7%AC%A6%E9%87%91%E5%B8%81">护符金币</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%B9%B8%E8%BF%90%E8%96%B0%E9%A6%99">幸运薰香</a>的宝可梦也参与对战时，拾取金币获得的零花钱数量翻倍。

令使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>降低1级。
 •  如果攻击无效或没有命中，不会产生该效果。
 •  使用者的白雾、替身或等无法阻止淘金潮的该副作用。
