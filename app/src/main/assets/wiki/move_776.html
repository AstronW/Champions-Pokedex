攻击目标造成伤害。

使用自身的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>代替自身的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>进行<a href="https://wiki.52poke.com/zh-hans/%E4%BC%A4%E5%AE%B3">伤害</a>计算。

攻击方<b>能</b>影响扑击伤害的因素：

 • 防御<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>（会被防御方的<a href="dex://entity/ability:109">纯朴</a>无视）；
 • <a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>；
 • <a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E5%A4%B4%E5%B8%A6">讲究头带</a>；
 • 增加或减少<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>的特性（如<a href="dex://entity/ability:37">大力士</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%85%A2%E5%90%AF%E5%8A%A8">慢启动</a>等）。

攻击方<b>不能</b>影响扑击伤害的因素：
 • 攻击能力变化；
 • <a href="https://wiki.52poke.com/zh-hans/%E8%BF%9B%E5%8C%96%E5%A5%87%E7%9F%B3">进化奇石</a>；
 • 增加<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>的特性（如<a href="dex://entity/ability:169">毛皮大衣</a>等）
