对最后造成自身伤害对应位置的宝可梦为目标，造成受到的招式×1.5倍固定伤害。该招式无法对没有效果的属性的宝可梦造成伤害，但忽略其他属性相克和<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>。

对于<a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E6%AC%A1%E6%94%BB%E5%87%BB%E7%B1%BB%E6%8B%9B%E5%BC%8F">多次攻击类招式</a>，仅使用最后一击的伤害计算金属爆炸的伤害。

金属爆炸的攻击目标会受<a href="https://wiki.52poke.com/zh-hans/%E4%B8%87%E4%BC%97%E7%9E%A9%E7%9B%AE">万众瞩目</a>状态的影响。

在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%89%E6%89%93%E5%AF%B9%E6%88%98">三打对战</a>中，金属爆炸可以攻击到对侧的宝可梦，但它不算是远程招式，因为在使用招式时只能选择自己作为目标。

当回合所有对手都没有使用过攻击招式攻击到使用者时，招式使用失败。
