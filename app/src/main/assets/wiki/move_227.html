
令目标接下来的 3 回合，只能使用其最后使用的招式。

以下情况会导致招式使用失败：
 •  目标在进入对战后尚未使用招式；
 •  目标最后使用的招式的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%B0%EF%BC%B0">ＰＰ</a>为0；
 •  目标最后使用的招式为<b>再来一次</b>、<a href="dex://entity/move:102">模仿</a>、<a href="dex://entity/move:166">写生</a>、<a href="dex://entity/move:165">挣扎</a>、<a href="dex://entity/move:144">变身</a>；
 •  目标最后使用的招式为调用其他招式的招式，包括<a href="dex://entity/move:274">借助</a>、<a href="dex://entity/move:383">仿效</a>、<a href="dex://entity/move:382">抢先一步</a>、<a href="dex://entity/move:118">挥指</a>、<a href="dex://entity/move:119">鹦鹉学舌</a>、<a href="dex://entity/move:267">自然之力</a>、<a href="dex://entity/move:214">梦话</a>；
 •  目标最后使用的招式为<a href="https://wiki.52poke.com/zh-hans/%EF%BC%BA%E6%8B%9B%E5%BC%8F">Ｚ招式</a>；
 •  目标最后使用的招式为<a href="dex://entity/move:744">极巨炮</a>；
 •  <a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%8C%96">极巨化</a>宝可梦使用的招式；
 •  <a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%98%9F%E9%98%9F%E8%BD%A6">天星队车</a>使用的专属招式。
