光合作用能够回复使用者<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。回复量由当前<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94%E5%9E%8B%E7%8A%B6%E6%80%81">天气型状态</a>决定。

在<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%99%B4%E5%A4%A9">大晴天</a>和<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%97%A5%E7%85%A7">大日照</a>状态下，回复使用者最大ＨＰ的<sup>2</sup>⁄<sub>3</sub>。

在没有或其他天气型状态时，回复使用者最大ＨＰ的<sup>1</sup>⁄<sub>2</sub>。在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%A8">下雨</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E9%9B%A8">大雨</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E6%9A%B4">沙暴</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E9%9B%B9">冰雹</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%AA">下雪</a>或<a href="https://wiki.52poke.com/zh-hans/%E8%B5%B7%E9%9B%BE">起雾</a>状态下，回复使用者最大ＨＰ的<sup>1</sup>⁄<sub>4</sub>。在使用者处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态时无法使用。
