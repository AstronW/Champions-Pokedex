攻击目标造成伤害。

如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%B0%8F">变小</a>状态，<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>翻倍。同时在这种状况下，闪电强袭一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

如果招式未命中、被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态阻挡，因为属性相性或<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%80%A7">特性</a>而没有产生效果，自身承受最大<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>的1⁄2（向下取整）的反作用力伤害。

使用者具有<a href="dex://entity/ability:98">魔法防守</a>特性时，招式没有产生效果时使用者不会承受伤害。

使用者具有<a href="dex://entity/ability:120">舍身</a>特性时，该招式威力提升20%。
