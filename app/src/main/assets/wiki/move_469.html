

在当回合内，使我方场地进入广域防守状态，保护我方全体宝可梦不受到来自对手的大部分目标为<a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E4%BD%9C%E7%94%A8%E8%8C%83%E5%9B%B4%E4%B8%BA%E5%AF%B9%E6%89%8B%E5%85%A8%E5%9C%BA%E7%9A%84%E6%8B%9B%E5%BC%8F">我方全体</a>或<a href="https://wiki.52poke.com/zh-hans/%3ACategory%3A%E4%BD%9C%E7%94%A8%E8%8C%83%E5%9B%B4%E4%B8%BA%E9%99%A4%E8%87%AA%E5%B7%B1%E5%A4%96%E5%85%A8%E5%9C%BA%E7%9A%84%E6%8B%9B%E5%BC%8F">场上全体</a>的招式的影响。

如果在本回合使用者最后行动，则招式会失败。

若成功使用广域防守，则连续使用<a href="dex://entity/move:197">看穿</a>、<a href="dex://entity/move:203">挺住</a>、<a href="dex://entity/move:182">守住</a>、<a href="dex://entity/move:588">王者盾牌</a>、<a href="dex://entity/move:596">尖刺防守</a>、<a href="dex://entity/move:661">碉堡</a>、<a href="dex://entity/move:792">拦堵</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%98%B2%E5%A3%81">极巨防壁</a>、<a href="dex://entity/move:852">线阱</a>或<a href="dex://entity/move:908">火焰守护</a>的成功率降低至上一次的<sup>1</sup>⁄<sub>3</sub>（最低至<sup>1</sup>⁄<sub>729</sub>）。

即使广域防守状态被解除，连续使用上述招式的成功率依旧会下降。

该招式不会被<a href="dex://entity/move:274">借助</a>或<a href="dex://entity/move:118">挥指</a>发动。
