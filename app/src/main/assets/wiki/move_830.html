攻击目标造成伤害。

令目标场地进入<a href="https://wiki.52poke.com/zh-hans/%E9%9A%90%E5%BD%A2%E5%B2%A9">隐形岩</a>状态，使交换上场的宝可梦受到伤害。
 •  如果使用者因目标的<a href="https://wiki.52poke.com/zh-hans/%E9%93%81%E5%88%BA">铁刺</a>特性、<a href="dex://entity/ability:24">粗糙皮肤</a>特性或<a href="https://wiki.52poke.com/zh-hans/%E5%87%B8%E5%87%B8%E5%A4%B4%E7%9B%94">凸凸头盔</a>而陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，则不会令目标场地进入隐形岩状态。
 •  •  如果使用者因自身携带的<a href="https://wiki.52poke.com/zh-hans/%E7%94%9F%E5%91%BD%E5%AE%9D%E7%8F%A0">生命宝珠</a>而陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，则可以正常令目标场地进入隐形岩状态。
