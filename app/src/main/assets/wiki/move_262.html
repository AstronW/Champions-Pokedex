令目标的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>降低2级。

令目标的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>降低2级。

使用者陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，除非此招式没有命中、使用失败或被<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E4%BD%8F%E7%B1%BB%E6%8B%9B%E5%BC%8F">防住类招式</a>阻挡。

如果目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态，或者对手对该招式免疫（例如<a href="dex://entity/ability:158">恶作剧之心</a>特性的宝可梦对恶属性使用该招式），此招式使用失败。但即使该招式无法对对手的<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>产生效果（例如对手特性为<a href="dex://entity/ability:29">恒净之躯</a>或者对手的攻击与特攻能力变化为-6），招式仍然能够使用成功，使用者陷入濒死状态。

对具有<a href="dex://entity/ability:156">魔法镜</a>特性的宝可梦使用的话，此招式不会被反弹。这与<a href="dex://entity/move:575">抛下狠话</a>的情况不同。
