在一回合内，先加热鸟嘴，再攻击目标造成伤害。

加热鸟嘴的动作<a href="https://wiki.52poke.com/zh-hans/%E4%BC%98%E5%85%88%E5%BA%A6">优先度</a>为+5，进行攻击的优先度为-3。如果在加热鸟嘴到发动攻击期间受到<a href="https://wiki.52poke.com/zh-hans/%E6%8E%A5%E8%A7%A6%E7%B1%BB%E6%8B%9B%E5%BC%8F">接触类招式</a>攻击，伤害的施加者陷入<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态。

该招式不能被<a href="dex://entity/move:119">鹦鹉学舌</a>学习，也不会被<a href="dex://entity/move:274">借助</a>、<a href="dex://entity/move:118">挥指</a>、<a href="dex://entity/move:214">梦话</a>或<a href="dex://entity/move:689">号令</a>发动。

鸟嘴加农炮攻击对<a href="dex://entity/ability:171">防弹</a>特性的宝可梦无效，但不能免疫<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态。
