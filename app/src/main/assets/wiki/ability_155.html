该特性的宝可梦受到恶属性、幽灵属性和虫属性属性招式攻击时，<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>提升1级。对于恶属性、幽灵属性和虫属性<a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>，每次攻击都能触发该特性。

受到<a href="dex://entity/ability:22">威吓</a>影响，该特性的宝可梦<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>提升1级。
