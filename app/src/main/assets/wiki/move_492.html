攻击目标造成伤害。

使用目标的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>能力值代替使用者的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>进行<a href="https://wiki.52poke.com/zh-hans/%E4%BC%A4%E5%AE%B3">伤害</a>计算。

以下内容取<b>目标</b>一方：
 •  目标的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a><a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>。

以下内容取<b>使用者</b>一方：
 •  与欺诈具有相同属性时能适用<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E4%B8%80%E8%87%B4%E5%8A%A0%E6%88%90">属性一致加成</a>；
 •  处于<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态时会导致欺诈的伤害减半；
 •  具有提升攻击的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%80%A7">特性</a>（例如<a href="dex://entity/ability:37">大力士</a>、<a href="dex://entity/ability:91">适应力</a>）、<a href="https://wiki.52poke.com/zh-hans/%E6%90%BA%E5%B8%A6%E7%89%A9%E5%93%81">携带物品</a>（例如<a href="https://wiki.52poke.com/zh-hans/%E8%AE%B2%E7%A9%B6%E5%A4%B4%E5%B8%A6">讲究头带</a>）时，能提升对应的能力。
