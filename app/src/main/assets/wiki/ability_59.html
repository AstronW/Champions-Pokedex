<a href="https://wiki.52poke.com/zh-hans/%E9%A3%98%E6%B5%AE%E6%B3%A1%E6%B3%A1">飘浮泡泡</a>的<a href="https://wiki.52poke.com/zh-hans/%E5%BD%A2%E6%80%81%E5%8F%98%E5%8C%96%23%E9%A3%98%E6%B5%AE%E6%B3%A1%E6%B3%A1">形态</a>与<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7">属性</a>根据<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94">天气</a>而改变：
 •  在<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%99%B4%E5%A4%A9">大晴天</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%97%A5%E7%85%A7">大日照</a>时，变为<a href="https://wiki.52poke.com/zh-hans/%E9%A3%98%E6%B5%AE%E6%B3%A1%E6%B3%A1"><span></span></a>太阳的样子与火属性；
 •  在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%A8">下雨</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E9%9B%A8">大雨</a>时，变为<a href="https://wiki.52poke.com/zh-hans/%E9%A3%98%E6%B5%AE%E6%B3%A1%E6%B3%A1"><span></span></a>雨水的样子与水属性；
 •  在<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E9%9B%B9">冰雹</a>或<a href="https://wiki.52poke.com/zh-hans/%E4%B8%8B%E9%9B%AA">下雪</a>天气时，变为<a href="https://wiki.52poke.com/zh-hans/%E9%A3%98%E6%B5%AE%E6%B3%A1%E6%B3%A1"><span></span></a>雪云的样子与冰属性；
 •  在<a href="dex://entity/ability:13">无关天气</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E9%97%B8">气闸</a>特性宝可梦在场或其他天气时，变为<a href="https://wiki.52poke.com/zh-hans/%E9%A3%98%E6%B5%AE%E6%B3%A1%E6%B3%A1"><span></span></a>飘浮泡泡的样子与一般属性。
该特性仅当拥有者为飘浮泡泡时有效，当飘浮泡泡失去该特性时形态变回一般属性的飘浮泡泡的样子。

其他宝可梦对飘浮泡泡使用变身后，会变成飘浮泡泡当前的形态。
