出场或获得此特性时所有攻击范围内的对手的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>下降1<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">级</a>。
 • 对处于<a href="https://wiki.52poke.com/zh-hans/%E7%A9%BA%E4%B8%AD">空中</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B0%B4%E4%B8%AD">水中</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E4%B8%8B">地下</a>或<a href="https://wiki.52poke.com/zh-hans/%E6%BD%9C%E4%BC%8F">潜伏</a>状态的宝可梦有效。
 • 拥有<a href="dex://entity/ability:29">恒净之躯</a>、<a href="dex://entity/ability:52">怪力钳</a>、<a href="dex://entity/ability:73">白色烟雾</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%87%91%E5%B1%9E%E9%98%B2%E6%8A%A4">金属防护</a>、<a href="dex://entity/ability:39">精神力</a>、<a href="dex://entity/ability:12">迟钝</a>、<a href="dex://entity/ability:113">胆量</a>和<a href="dex://entity/ability:20">我行我素</a>特性的宝可梦不受影响。
 • 处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态的宝可梦不受影响。
 • 在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%89%E6%89%93%E5%AF%B9%E6%88%98">三打对战</a>中，若该特性的宝可梦不是从中间出场，则只能威吓到与该宝可梦相同一侧和中间的宝可梦。
 •  <a href="dex://entity/ability:155">胆怯</a>特性或持有<a href="https://wiki.52poke.com/zh-hans/%E8%83%86%E6%80%AF%E7%90%83">胆怯球</a>的宝可梦，在受到威吓后能够提升速度。
 •  <a href="dex://entity/ability:275">看门犬</a>特性的宝可梦，威吓效果无效，并且攻击提高1级。

<h2>宝可梦不可思议迷宫系列</h2>
用<a href="https://wiki.52poke.com/zh-hans/%E7%89%A9%E7%90%86%E6%8B%9B%E5%BC%8F">物理招式</a>攻击该特性的宝可梦的伤害下降20%。
