使用<a href="https://wiki.52poke.com/zh-hans/%E6%8E%A5%E8%A7%A6%E7%B1%BB%E6%8B%9B%E5%BC%8F">接触类招式</a>攻击该特性的宝可梦时会有30%的机率陷入<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>、<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>或<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>状态。

 •  其中，<a href="https://wiki.52poke.com/zh-hans/%E7%9D%A1%E7%9C%A0">睡眠</a>概率略高于10%，<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>概率为10%，<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>概率略低于10%。&lt;ref&gt;[https://projectpokemon.org/forums/showthread.php?23700-Beta-the-Pok%E9check-VS.-Player-(battle-video-parser)&amp;p=147302&amp;viewfull=1#post147302 破解代码]&lt;/ref&gt;

<a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>的每一击都可能触发该特性。

该特性属于<a href="https://wiki.52poke.com/zh-hans/%E7%B2%89%E6%9C%AB%E7%B1%BB%E6%8B%9B%E5%BC%8F%23%E7%B2%89%E6%9C%AB%E7%B1%BB%E7%89%B9%E6%80%A7">粉末类特性</a>，因此对草属性、拥有<a href="dex://entity/ability:142">防尘</a>特性或携带<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%B0%98%E6%8A%A4%E7%9B%AE%E9%95%9C">防尘护目镜</a>的宝可梦无效。
