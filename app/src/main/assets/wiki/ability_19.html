
拥有该特性的宝可梦不会受到其他宝可梦招式的<a href="https://wiki.52poke.com/zh-hans/%E8%BF%BD%E5%8A%A0%E6%95%88%E6%9E%9C">追加效果</a>影响。
 • 不能防止<a href="https://wiki.52poke.com/zh-hans/%E5%8F%98%E5%8C%96%E6%8B%9B%E5%BC%8F">变化招式</a>（如<a href="dex://entity/move:79">催眠粉</a>、<a href="dex://entity/move:86">电磁波</a>）的效果。
 • 不能防止该特性宝可梦自身使用招式时的副作用（如<a href="dex://entity/move:370">近身战</a>）。
 • 不能防止招式对攻击方自身（如<a href="dex://entity/move:612">增强拳</a>）或场地（如<a href="dex://entity/move:830">岩斧</a>）施加的追加效果。也不能防止<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E6%8B%9B%E5%BC%8F">极巨招式</a>或<a href="https://wiki.52poke.com/zh-hans/%E8%B6%85%E6%9E%81%E5%B7%A8%E6%8B%9B%E5%BC%8F">超极巨招式</a>的效果。
 • 可以防止<a href="dex://entity/ability:143">毒手</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%AF%92%E9%94%81%E9%93%BE">毒锁链</a>特性造成的<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>状态、<a href="dex://entity/move:374">投掷</a>投出部分道具时造成的效果，尽管这些不属于追加效果。
