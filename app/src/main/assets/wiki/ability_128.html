能力变化被对手降低时，每降低一种能力，<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>就会提升2级。若有多个能力被下降，那么上升攻击的阶级相应增加。

下列情况将触发此特性：
 •  受到对手的招式影响导致能力变化降低（例如受到<a href="dex://entity/move:432">清除浓雾</a>）。
 •  受到对手的特性影响导致能力变化降低（例如受到<a href="dex://entity/ability:22">威吓</a>）。
 •  踩到己方或对手引发的<a href="https://wiki.52poke.com/zh-hans/%E9%BB%8F%E9%BB%8F%E7%BD%91">黏黏网</a>导致速度降低。
 •  <a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E5%9B%A2%E4%BD%93%E6%88%98">极巨团体战</a>中神秘障壁被打破导致防御和特防降低，会触发两次。

下列情况不能触发此特性：
 •  由于招式的副作用导致能力变化降低（例如使用<a href="dex://entity/move:370">近身战</a>）。
 •  双打对战中由队友使用招式导致能力变化降低（例如使用<a href="dex://entity/move:575">抛下狠话</a>、<a href="dex://entity/move:903">糖浆炸弹</a>、<a href="dex://entity/move:523">重踏</a>）
 •  由于道具的作用导致能力变化降低（例如发动<a href="https://wiki.52poke.com/zh-hans/%E5%AE%A2%E6%88%BF%E6%9C%8D%E5%8A%A1">客房服务</a>）
