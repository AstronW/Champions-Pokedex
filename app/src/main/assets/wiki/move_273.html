陷入祈愿状态，-{zh-hans:使用祈愿后的下一回合，<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>会回复。;zh-hant:使用祈愿后的下一回合，<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>会回复。}-

下回合结束时，恢复自身最大ＨＰ的<sup>1</sup>⁄<sub>2</sub>。

如果自身交换下场或使用<a href="dex://entity/move:226">接棒</a>、<a href="dex://entity/move:369">急速折返</a>、<a href="dex://entity/move:521">伏特替换</a>离场，则新上场的宝可梦会恢复ＨＰ，恢复量为招式使用者的最大ＨＰ×<sup>1</sup>⁄<sub>2</sub>。

如果自身被<a href="dex://entity/move:46">吼叫</a>、<a href="dex://entity/move:18">吹飞</a>、<a href="dex://entity/move:525">龙尾</a>、<a href="dex://entity/move:509">巴投</a>强制下场，该效果仍会起作用。

如果自身<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>，该效果将不会起作用。
