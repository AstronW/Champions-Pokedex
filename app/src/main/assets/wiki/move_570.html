攻击周围的目标造成伤害，自身的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>恢复“对所有目标造成的总伤害×50%”。在攻击方携带<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%A0%B9%E8%8C%8E">大根茎</a>时，攻击伤害不变，ＨＰ恢复量提高到“对所有目标造成的总伤害×65%”。

如果攻击方处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态，<a href="https://wiki.52poke.com/zh-hans/%E5%90%B8%E5%8F%96%EF%BC%A8%EF%BC%B0%E7%9A%84%E6%8B%9B%E5%BC%8F">招式使用失败</a>。

使用抛物面充电攻击<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态下的宝可梦可以恢复ＨＰ。
