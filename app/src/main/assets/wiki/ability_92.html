使用攻击次数浮动在2～5次之间的<a href="https://wiki.52poke.com/zh-hans/%E8%BF%9E%E7%BB%AD%E6%8B%9B%E5%BC%8F">连续招式</a>时，攻击次数会固定在5次。使用<a href="dex://entity/move:167">三连踢</a>、<a href="dex://entity/move:813">三旋击</a>或<a href="dex://entity/move:860">鼠数儿</a>时，只计算一次命中率。
 • 即使发动攻击的宝可梦的特性在中途失去连续攻击特性（如变为<a href="dex://entity/ability:152">木乃伊</a>特性），仍然会继续攻击最大次数。
