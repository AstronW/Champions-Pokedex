攻击目标造成伤害。

使用后自身电属性变成<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E5%B1%9E%E6%80%A7">无属性</a>，其他属性的顺位不会改变，离场后恢复。

拥有<a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E5%B1%9E%E6%80%A7">多属性</a>和<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A1%EF%BC%B2%E7%B3%BB%E7%BB%9F">ＡＲ系统</a>特性的电属性宝可梦使用此招式后，特性继续生效，宝可梦的电属性不会消失。

使用者本身不具有电属性时，招式使用失败。

太晶化电属性的宝可梦和太晶<a href="https://wiki.52poke.com/zh-hans/%E6%98%9F%E6%99%B6">星晶</a>属性的具有电属性的宝可梦使用此招式后，宝可梦的电属性不会消失。
