自身陷入<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态，并攻击除自身外场上所有能攻击到的宝可梦。

在<a href="https://wiki.52poke.com/zh-hans/%E8%96%84%E9%9B%BE%E5%9C%BA%E5%9C%B0">薄雾场地</a>上，若使用者为<a href="https://wiki.52poke.com/zh-hans/%E5%9C%B0%E9%9D%A2%E4%B8%8A%E7%9A%84%E5%AE%9D%E5%8F%AF%E6%A2%A6">地面上的宝可梦</a>，招式威力进一步提升50%。

<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E5%A4%B4%E5%B8%A6">气势头带</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E5%8A%BF%E6%8A%AB%E5%B8%A6">气势披带</a>、<a href="dex://entity/ability:5">结实</a>特性不能阻止使用者陷入濒死状态。

即使招式未命中、被<a href="https://wiki.52poke.com/zh-hans/%E5%AE%88%E4%BD%8F">守住</a>状态阻挡，或因为属性相性而没有产生效果，使用者仍然会陷入濒死状态。

有<a href="dex://entity/ability:6">湿气</a>特性的宝可梦在场时，招式使用失败，且使用者不会陷入濒死状态。
