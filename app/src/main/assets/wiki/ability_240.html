该特性的宝可梦受到对方的能力下降的招式或特性时，能将这些效果反弹到使用该招式或触发该特性的宝可梦。包括<a href="https://wiki.52poke.com/zh-hans/%E9%BB%8F%E9%BB%8F%E7%BD%91">黏黏网</a>的效果。

例如：<a href="https://wiki.52poke.com/zh-hans/%E9%A3%8E%E9%80%9F%E7%8B%97">风速狗</a>触发了<a href="dex://entity/ability:22">威吓</a>，使钢铠鸦的攻击下降1级。此时镜甲效果的反弹目标<b>仅是</b>风速狗，<b>不会</b>触发威吓的所有目标降低攻击效果。
