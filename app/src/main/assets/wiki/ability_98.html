不会受到<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A9%E6%B0%94">天气</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%80%A7">特性</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%8A%B6%E6%80%81%E5%8F%98%E5%8C%96">状态变化</a>、除<a href="dex://entity/move:165">挣扎</a>之外的<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E4%BD%9C%E7%94%A8%E5%8A%9B%E4%BC%A4%E5%AE%B3%E7%9A%84%E6%8B%9B%E5%BC%8F">反作用力伤害的招式</a>等造成的伤害。
 • 非伤害效果仍然保留：例如<a href="https://wiki.52poke.com/zh-hans/%E7%81%BC%E4%BC%A4">灼伤</a>状态的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>减半效果，<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">剧毒</a>状态的伤害计数增加，<a href="https://wiki.52poke.com/zh-hans/%E7%94%9F%E5%91%BD%E5%AE%9D%E7%8F%A0">生命宝珠</a>对招式威力的增幅作用。
 • 由于未受到<a href="https://wiki.52poke.com/zh-hans/%E5%AF%84%E7%94%9F%E7%A7%8D%E5%AD%90">寄生种子</a>的伤害，对手也不会回复ＨＰ。

下列会减少ＨＰ的效果不能被此特性防止：
 • 招式的副作用：
 •  • 由于使用<a href="dex://entity/move:174">诅咒</a>、<a href="dex://entity/move:164">替身</a>、<a href="dex://entity/move:187">腹鼓</a>、<a href="dex://entity/move:220">分担痛楚</a>而失去ＨＰ
 •  • 由<a href="https://wiki.52poke.com/zh-hans/%E5%90%8C%E5%91%BD">同命</a>、<a href="https://wiki.52poke.com/zh-hans/%E7%81%AD%E4%BA%A1%E4%B9%8B%E6%AD%8C">灭亡之歌</a>直接导致的<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>状态
 •  • <a href="https://wiki.52poke.com/zh-hans/%E9%80%A0%E6%88%90%E8%87%AA%E8%BA%AB%E9%99%B7%E5%85%A5%E6%BF%92%E6%AD%BB%E7%8A%B6%E6%80%81%E7%9A%84%E6%8B%9B%E5%BC%8F">造成自身陷入濒死状态的招式</a>
 • 由于<a href="dex://entity/move:165">挣扎</a>而受到的反作用力伤害
 • 由于<a href="https://wiki.52poke.com/zh-hans/%E6%B7%B7%E4%B9%B1">混乱</a>而对自己造成的伤害

在<a href="https://wiki.52poke.com/zh-hans/%E7%AC%AC%E5%9B%9B%E4%B8%96%E4%BB%A3">第四世代</a>中，在对战外<a href="https://wiki.52poke.com/zh-hans/%E4%B8%AD%E6%AF%92">中毒</a>依然会减少ＨＰ。
