破坏对方场地的<a href="https://wiki.52poke.com/zh-hans/%E5%85%89%E5%A2%99">光墙</a>、<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E5%B0%84%E5%A3%81">反射壁</a>和<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%85%89%E5%B9%95">极光幕</a>，并攻击目标造成伤害。

招式的属性会根据使用者的形态改变：
 • <a href="https://wiki.52poke.com/zh-hans/%E8%82%AF%E6%B3%B0%E7%BD%97"><span></span></a><a href="https://wiki.52poke.com/zh-hans/%E8%82%AF%E6%B3%B0%E7%BD%97">肯泰罗</a>（<a href="https://wiki.52poke.com/zh-hans/%E5%BD%A2%E6%80%81%E5%8F%98%E5%8C%96%23%E8%82%AF%E6%B3%B0%E7%BD%97">斗战种</a>）使出时，招式为格斗属性；
 • <a href="https://wiki.52poke.com/zh-hans/%E8%82%AF%E6%B3%B0%E7%BD%97"><span></span></a><a href="https://wiki.52poke.com/zh-hans/%E8%82%AF%E6%B3%B0%E7%BD%97">肯泰罗</a>（<a href="https://wiki.52poke.com/zh-hans/%E5%BD%A2%E6%80%81%E5%8F%98%E5%8C%96%23%E8%82%AF%E6%B3%B0%E7%BD%97">火炽种</a>）使出时，招式为火属性；
 • <a href="https://wiki.52poke.com/zh-hans/%E8%82%AF%E6%B3%B0%E7%BD%97"><span></span></a><a href="https://wiki.52poke.com/zh-hans/%E8%82%AF%E6%B3%B0%E7%BD%97">肯泰罗</a>（<a href="https://wiki.52poke.com/zh-hans/%E5%BD%A2%E6%80%81%E5%8F%98%E5%8C%96%23%E8%82%AF%E6%B3%B0%E7%BD%97">水澜种</a>）使出时，招式为水属性。
