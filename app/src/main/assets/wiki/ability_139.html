每回合结束有50%机率获得使用过的<a href="https://wiki.52poke.com/zh-hans/%E6%A0%91%E6%9E%9C">树果</a>（包括对方宝可梦携带，但被该特性的宝可梦使用），<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%99%B4%E5%A4%A9">大晴天</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%A4%A7%E6%97%A5%E7%85%A7">大日照</a>下几率为100%。

收获特性每回合最多触发一次。如果携带的树果在再次获得后立即被消耗，直到下一次收获能再次触发。

如果超过一个宝可梦有收获特性，速度快的宝可梦先获得使用过的树果。

收获特性无法重复获得被其他宝可梦使用的树果。例如对方宝可梦使用了<a href="dex://entity/move:450">虫咬</a>。
