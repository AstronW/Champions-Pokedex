回收在对战中最后消耗的<a href="https://wiki.52poke.com/zh-hans/%E9%81%93%E5%85%B7">道具</a>。

 •  如果自身携带有道具，则招式使用失败。
 •  被<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E6%8D%A2%E5%AE%9D%E5%8F%AF%E6%A2%A6">替换</a>下场之前消耗的道具，在再次上场之后仍可以被回收。
 •  因受到攻击而破裂的<a href="https://wiki.52poke.com/zh-hans/%E6%B0%94%E7%90%83">气球</a>无法被回收。
 •  通过<a href="https://wiki.52poke.com/zh-hans/%E7%83%A7%E5%B0%BD">烧尽</a>、<a href="dex://entity/move:365">啄食</a>、<a href="dex://entity/move:450">虫咬</a>、<a href="dex://entity/move:343">渴望</a>、<a href="dex://entity/move:282">拍落</a>、<a href="dex://entity/move:415">掉包</a>、<a href="dex://entity/move:168">小偷</a>或<a href="dex://entity/move:271">戏法</a>失去的道具无法被回收。
 •  消耗的道具被同伴或对手<a href="dex://entity/ability:53">捡拾</a>后无法被回收。
 •  通过<a href="dex://entity/move:374">投掷</a>消耗的道具可以被回收（除非被<a href="dex://entity/ability:53">捡拾</a>）。
