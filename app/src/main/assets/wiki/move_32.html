角钻造成与对手的最大<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>相同的固定伤害。只要<a href="https://wiki.52poke.com/zh-hans/%E5%B1%9E%E6%80%A7%E7%9B%B8%E5%85%8B%E8%A1%A8">属性相性</a>不为0倍，就能一击造成<a href="https://wiki.52poke.com/zh-hans/%E6%BF%92%E6%AD%BB">濒死</a>。

如果自身<a href="https://wiki.52poke.com/zh-hans/%E7%AD%89%E7%BA%A7">等级</a>低于目标，招式使用失败。

此招式不使用通常<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD%E5%88%A4%E5%AE%9A">命中判定</a>：
 •  招式的<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD">命中</a>等于：(30 + 使用者等级 - 目标等级)%。
 •  命中的概率不会受到<a href="https://wiki.52poke.com/zh-hans/%E5%91%BD%E4%B8%AD%E7%8E%87">命中率</a>和<a href="https://wiki.52poke.com/zh-hans/%E9%97%AA%E9%81%BF%E7%8E%87">闪避率</a>影响。
 •  <a href="https://wiki.52poke.com/zh-hans/%E9%94%81%E5%AE%9A">锁定</a>状态和<a href="dex://entity/ability:99">无防守</a>特性能够使此招式变成必定命中。

此招式对<a href="dex://entity/ability:5">结实</a>特性的宝可梦无效。
