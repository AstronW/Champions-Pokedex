将使用者的<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB">攻击</a>与目标的攻击相加之后取其算术平均数，相加时不计算<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>。

攻击较高的一方攻击降低超过平均数的部分，攻击较低的一方攻击增加不足平均数的部分。

将使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%94%BB">特攻</a>与目标的特攻相加之后取其算术平均数，相加时不计算<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>。

特攻较高的一方特攻降低超过平均数的部分，特攻较低的一方特攻增加不足平均数的部分。

力量平分一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。
