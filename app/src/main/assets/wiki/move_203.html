在本回合结束前使自身保留至少1点ＨＰ，即使受到<a href="https://wiki.52poke.com/zh-hans/%E4%B8%80%E5%87%BB%E5%BF%85%E6%9D%80%E7%9A%84%E6%8B%9B%E5%BC%8F">一击必杀的招式</a>的攻击也会保留1点ＨＰ。
 •  无法阻止招式的附加效果。
 •  无法阻止<a href="https://wiki.52poke.com/zh-hans/%E5%BC%82%E5%B8%B8%E7%8A%B6%E6%80%81">异常状态</a>或<a href="https://wiki.52poke.com/zh-hans/%E7%8A%B6%E6%80%81%E5%8F%98%E5%8C%96">状态变化</a>造成的伤害。

如果在本回合使用者最后行动，则招式会失败。

若成功使用<a href="dex://entity/move:197">看穿</a>、挺住、<a href="dex://entity/move:182">守住</a>、<a href="dex://entity/move:588">王者盾牌</a>、<a href="dex://entity/move:596">尖刺防守</a>、<a href="dex://entity/move:661">碉堡</a>、<a href="dex://entity/move:792">拦堵</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%98%B2%E5%A3%81">极巨防壁</a>、<a href="dex://entity/move:852">线阱</a>、<a href="dex://entity/move:908">火焰守护</a>、<a href="dex://entity/move:561">掀榻榻米</a>、<a href="dex://entity/move:469">广域防守</a>或<a href="dex://entity/move:501">快速防守</a>，则连续使用挺住的成功率降低至上一次的<sup>1</sup>⁄<sub>3</sub>（最低至<sup>1</sup>⁄<sub>729</sub>）。

若成功使用挺住，则连续使用<a href="dex://entity/move:197">看穿</a>、挺住、<a href="dex://entity/move:182">守住</a>、<a href="dex://entity/move:588">王者盾牌</a>、<a href="dex://entity/move:596">尖刺防守</a>、<a href="dex://entity/move:661">碉堡</a>、<a href="dex://entity/move:792">拦堵</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%9E%81%E5%B7%A8%E9%98%B2%E5%A3%81">极巨防壁</a>、<a href="dex://entity/move:852">线阱</a>或<a href="dex://entity/move:908">火焰守护</a>的成功率降低至上一次的<sup>1</sup>⁄<sub>3</sub>（最低至<sup>1</sup>⁄<sub>729</sub>）。

该招式不会被<a href="dex://entity/move:274">借助</a>或<a href="dex://entity/move:118">挥指</a>触发。
