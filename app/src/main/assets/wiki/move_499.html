攻击目标造成伤害。

清除之烟一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。

招式命中后将目标所有的<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>的等级回归为0级。如果招式对目标无效或目标处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态，则不能清除目标的能力变化。

使用该招式不会被<a href="dex://entity/ability:29">恒净之躯</a>、<a href="dex://entity/ability:73">白色烟雾</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%87%91%E5%B1%9E%E9%98%B2%E6%8A%A4">金属防护</a>、<a href="dex://entity/ability:166">花幕</a>、<a href="dex://entity/ability:52">怪力钳</a>、<a href="dex://entity/ability:145">健壮胸肌</a>、<a href="dex://entity/ability:51">锐利目光</a>、<a href="dex://entity/move:54">白雾</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%B8%85%E5%87%80%E5%9D%A0%E9%A5%B0">清净坠饰</a>视作降低能力。
