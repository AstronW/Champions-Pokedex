攻击目标造成伤害。目标<a href="https://wiki.52poke.com/zh-hans/%E9%80%9F%E5%BA%A6">速度</a>比使用者越大，则该招式<a href="https://wiki.52poke.com/zh-hans/%E5%A8%81%E5%8A%9B">威力</a>越大。

威力的计算公式为 25 × 目标速度 ÷ 使用者速度，最大为 150。

 •  速度为实际值，受<a href="https://wiki.52poke.com/zh-hans/%E9%BA%BB%E7%97%B9">麻痹</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%BB%91%E8%89%B2%E9%93%81%E7%90%83">黑色铁球</a>、<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>、<a href="dex://entity/ability:84">轻装</a>特性、<a href="https://wiki.52poke.com/zh-hans/%E9%A1%BA%E9%A3%8E">顺风</a>场地等的影响。

对<a href="dex://entity/ability:171">防弹</a>特性的宝可梦无效。
