
拥有该特性的宝可梦免疫地面属性招式（除了<a href="dex://entity/move:28">泼沙</a>和<a href="dex://entity/move:614">千箭齐发</a>），不会受到<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E7%A9%B4">沙穴</a>特性和<a href="https://wiki.52poke.com/zh-hans/%E6%AF%92%E8%8F%B1">毒菱</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%92%92%E8%8F%B1">撒菱</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%BB%8F%E9%BB%8F%E7%BD%91">黏黏网</a>和<a href="https://wiki.52poke.com/zh-hans/%E5%9C%BA%E5%9C%B0%E5%9E%8B%E7%8A%B6%E6%80%81">场地型状态</a>等<a href="https://wiki.52poke.com/zh-hans/%E7%8A%B6%E6%80%81%E5%8F%98%E5%8C%96">状态变化</a>的影响。

使用<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB%E6%8B%9B%E5%BC%8F">攻击招式</a>打倒宝可梦的时候，会提高自己除<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>外<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%80%BC">能力值</a>最高的一项<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%23%E5%B8%B8%E8%A7%84%E8%83%BD%E5%8A%9B">常规能力</a>1级。
