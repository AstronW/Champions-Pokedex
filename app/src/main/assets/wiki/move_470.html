将使用者的<a href="https://wiki.52poke.com/zh-hans/%E9%98%B2%E5%BE%A1">防御</a>与目标的防御相加之后取其算术平均数，相加时不计算<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>。

防御较高的一方防御降低超过平均数的部分，防御较低的一方防御增加不足平均数的部分。

将使用者的<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E9%98%B2">特防</a>与目标的特防相加之后取其算术平均数，相加时不计算<a href="https://wiki.52poke.com/zh-hans/%E8%83%BD%E5%8A%9B%E5%8F%98%E5%8C%96">能力变化</a>。

特防较高的一方特防降低超过平均数的部分，特防较低的一方特防增加不足平均数的部分。

防守平分一定会命中，除非目标正在使用<a href="https://wiki.52poke.com/zh-hans/%E8%93%84%E5%8A%9B%E7%9A%84%E6%8B%9B%E5%BC%8F">蓄力的招式</a>并不在场地上。
