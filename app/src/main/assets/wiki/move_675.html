攻击目标造成伤害。

令目标陷入地狱突刺状态，-{zh-hans:在２回合内，无法使出<a href="https://wiki.52poke.com/zh-hans/%E5%A3%B0%E9%9F%B3%E7%9A%84%E6%8B%9B%E5%BC%8F">声音的招式</a>。;zh-hant:在２回合内，无法使出会发出<a href="https://wiki.52poke.com/zh-hans/%E5%A3%B0%E9%9F%B3%E7%9A%84%E6%8B%9B%E5%BC%8F">声音的招式</a>。}-

阻止目标使用声音招式的效果属于<a href="https://wiki.52poke.com/zh-hans/%E8%BF%BD%E5%8A%A0%E6%95%88%E6%9E%9C">追加效果</a>，可以被目标的<a href="dex://entity/ability:19">鳞粉</a>或<a href="https://wiki.52poke.com/zh-hans/%E5%AF%86%E6%8E%A2%E6%96%97%E7%AF%B7">密探斗篷</a>防止，也能够发动使用者的<a href="dex://entity/ability:125">强行</a>特性。
