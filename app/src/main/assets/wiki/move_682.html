攻击目标造成伤害。

使用后自身火属性变成<a href="https://wiki.52poke.com/zh-hans/%E6%97%A0%E5%B1%9E%E6%80%A7">无属性</a>，其他属性的顺位不会改变，离场后恢复。

处于<a href="https://wiki.52poke.com/zh-hans/%E5%86%B0%E5%86%BB">冰冻</a>状态的宝可梦，无论是否命中，只要成功使用该招式，就可以解除冰冻。


不具有火属性的宝可梦使出此招式的话，会使用失败。判定是否失败优先于<a href="dex://entity/ability:168">变幻自如</a>的效果，使用失败时变幻自如特性也不会发动。

拥有<a href="https://wiki.52poke.com/zh-hans/%E5%A4%9A%E5%B1%9E%E6%80%A7">多属性</a>和<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A1%EF%BC%B2%E7%B3%BB%E7%BB%9F">ＡＲ系统</a>特性的火属性宝可梦使用此招式后，特性继续生效，宝可梦的火属性不会消失。

太晶化火属性的宝可梦使用此招式后，宝可梦的火属性不会消失。
