在<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8C%E6%89%93%E5%AF%B9%E6%88%98">双打对战</a>中与己方目标交换位置；在<a href="https://wiki.52poke.com/zh-hans/%E4%B8%89%E6%89%93%E5%AF%B9%E6%88%98">三打对战</a>中与另一侧的己方目标交换位置。

在三打对战中处于中间位置时、或目标位置没有宝可梦、或在其他对战中使用该招式会失败。

对使用该招式的宝可梦使用的<a href="dex://entity/move:228">追打</a>不能发动特效。

招式使用成功后，连续使用该招式的成功率降低至上一次的<sup>1</sup>⁄<sub>3</sub>。

同一回合内，若另一只己方宝可梦已经成功使用过交换场地，则该招式会失败。
