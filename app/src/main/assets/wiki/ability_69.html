不会受到<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8D%E4%BD%9C%E7%94%A8%E5%8A%9B%E4%BC%A4%E5%AE%B3%E7%9A%84%E6%8B%9B%E5%BC%8F">自身招式的反作用力伤害</a>。作用范围不包括（可能）按自身最大ＨＰ比例损伤自身的招式。

此特性不影响<a href="https://wiki.52poke.com/zh-hans/%E7%94%9F%E5%91%BD%E5%AE%9D%E7%8F%A0">生命宝珠</a>的副作用。

如果具有坚硬脑袋特性的宝可梦在使出这类招式后立即失去了此特性（例如使用<a href="dex://entity/move:394">闪焰冲锋</a>攻击具有<a href="dex://entity/ability:152">木乃伊</a>特性的宝可梦），则仍然要受到反作用力伤害。
