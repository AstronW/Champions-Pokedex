该特性的宝可梦不会被同伴的<a href="https://wiki.52poke.com/zh-hans/%E7%89%A9%E7%90%86%E6%8B%9B%E5%BC%8F">物理招式</a>和<a href="https://wiki.52poke.com/zh-hans/%E7%89%B9%E6%AE%8A%E6%8B%9B%E5%BC%8F">特殊招式</a>命中。例如：在<a href="https://wiki.52poke.com/zh-hans/%E5%8F%8C%E6%89%93%E5%AF%B9%E6%88%98">双打对战</a>中，同伴对自身以外的宝可梦使用<a href="dex://entity/move:435">放电</a>，该特性宝可梦不会受到攻击。
