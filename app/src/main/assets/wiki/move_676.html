如果目标是对手，攻击目标造成伤害。

如果目标是同伴，花粉团能够回复目标<sup>1</sup>⁄<sub>2</sub>的<a href="https://wiki.52poke.com/zh-hans/%EF%BC%A8%EF%BC%B0">ＨＰ</a>。在使用者处于<a href="https://wiki.52poke.com/zh-hans/%E5%9B%9E%E5%A4%8D%E5%B0%81%E9%94%81">回复封锁</a>状态时无法使用。

对<a href="dex://entity/ability:171">防弹</a>特性的宝可梦无效。

因为该招式是<a href="https://wiki.52poke.com/zh-hans/%E6%94%BB%E5%87%BB%E6%8B%9B%E5%BC%8F">攻击招式</a>，因此：
 • 对特性为<a href="dex://entity/ability:140">心灵感应</a>的同伴使用会失败；
 • 对特性为<a href="https://wiki.52poke.com/zh-hans/%E7%A5%9E%E5%A5%87%E5%AE%88%E6%8A%A4">神奇守护</a>的同伴使用会失败；除非效果绝佳。
 • 对<a href="https://wiki.52poke.com/zh-hans/%E9%AD%94%E6%B3%95%E5%8F%8D%E5%B0%84">魔法反射</a>、<a href="dex://entity/ability:156">魔法镜</a>、<a href="dex://entity/ability:283">黄金之躯</a>的同伴有效。
 • 陷入<a href="https://wiki.52poke.com/zh-hans/%E6%8C%91%E8%A1%85">挑衅</a>状态仍可对同伴使用，回复同伴HP

除以上无效的情况，与<a href="dex://entity/move:505">治愈波动</a>和<a href="dex://entity/move:666">花疗</a>不同，该招式对处于<a href="https://wiki.52poke.com/zh-hans/%E6%9B%BF%E8%BA%AB">替身</a>状态的同伴使用时，仍然有效。
