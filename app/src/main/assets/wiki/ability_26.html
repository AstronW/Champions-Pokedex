
拥有该特性的宝可梦免疫地面属性招式（除了<a href="dex://entity/move:28">泼沙</a>和<a href="dex://entity/move:614">千箭齐发</a>），不会受到<a href="https://wiki.52poke.com/zh-hans/%E6%B2%99%E7%A9%B4">沙穴</a>特性和<a href="https://wiki.52poke.com/zh-hans/%E6%AF%92%E8%8F%B1">毒菱</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%92%92%E8%8F%B1">撒菱</a>、<a href="https://wiki.52poke.com/zh-hans/%E9%BB%8F%E9%BB%8F%E7%BD%91">黏黏网</a>和<a href="https://wiki.52poke.com/zh-hans/%E5%9C%BA%E5%9C%B0%E5%9E%8B%E7%8A%B6%E6%80%81">场地型状态</a>等<a href="https://wiki.52poke.com/zh-hans/%E7%8A%B6%E6%80%81%E5%8F%98%E5%8C%96">状态变化</a>的影响。拥有该特性的毒属性的宝可梦无法清除<a href="https://wiki.52poke.com/zh-hans/%E6%AF%92%E8%8F%B1">毒菱</a>。

当宝可梦持有道具<a href="https://wiki.52poke.com/zh-hans/%E9%BB%91%E8%89%B2%E9%93%81%E7%90%83">黑色铁球</a>，或是宝可梦处于<a href="https://wiki.52poke.com/zh-hans/%E5%87%BB%E8%90%BD">击落</a>、<a href="https://wiki.52poke.com/zh-hans/%E6%89%8E%E6%A0%B9">扎根</a>状态，或是场地上存在<a href="https://wiki.52poke.com/zh-hans/%E9%87%8D%E5%8A%9B">重力</a>状态时，该特性失效。
